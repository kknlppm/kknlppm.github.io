<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Kelompok KKN — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1200px] mx-auto px-5 py-5">

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div id="segmenTahun" class="segmen" role="group" aria-label="Tahun ajaran"></div>
    <div class="flex-1 min-w-[12rem]">
      <label for="cari" class="sr-only">Cari kelompok</label>
      <input id="cari" type="search" class="medan" spellcheck="false"
             placeholder="Nama kelompok, lokasi, atau pembimbing">
    </div>
    <output id="ringkasan" class="font-data text-xs text-tinta-redup whitespace-nowrap basis-full sm:basis-auto"></output>
    <button id="tombolTambah" class="tombol-utama">Tambah kelompok</button>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-15rem)]">
      <table class="register">
        <thead>
          <tr>
            <th>Kelompok</th>
            <th class="text-right">Anggota</th>
            <th>Lokasi</th>
            <th>Dosen pembimbing</th>
            <th class="hidden sm:table-cell">NIDN</th>
            <th>TA</th>
            <th class="text-right">Tindakan</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <nav id="kakiHalaman" class="flex items-center justify-between gap-3 mt-4" aria-label="Halaman" hidden>
    <button id="sebelumnya" type="button" class="tombol-halus" disabled aria-label="Sebelumnya"><span aria-hidden="true">←</span><span class="hidden sm:inline">Sebelumnya</span></button>
    <span id="posisiHalaman" class="font-data text-xs text-tinta-redup whitespace-nowrap"></span>
    <button id="berikutnya" type="button" class="tombol-halus" disabled aria-label="Berikutnya"><span class="hidden sm:inline">Berikutnya</span><span aria-hidden="true">→</span></button>
  </nav>
</main>

<!-- Laci formulir. Muncul dari kanan supaya daftar di belakangnya tetap
     terlihat — menambah kelompok biasanya dilakukan sambil melihat yang
     sudah ada, bukan setelah melupakannya. -->
<div id="tirai" class="tirai" hidden></div>
<aside id="laci" class="laci" hidden aria-labelledby="judulLaci" role="dialog" aria-modal="true">
  <form id="formKelompok" class="flex flex-col h-full" novalidate>
    <div class="px-5 py-4 border-b border-garis">
      <h2 id="judulLaci" class="judul-halaman text-lg">Tambah kelompok</h2>
    </div>

    <div class="flex-1 overflow-auto px-5 py-4 space-y-4">
      <div id="pesanLaci" hidden role="alert"></div>

      <div>
        <label for="fKelompok" class="block text-sm font-medium mb-1.5">Nama kelompok</label>
        <input id="fKelompok" name="kelompok" class="medan" required placeholder="mis. 23">
      </div>
      <div>
        <label for="fTahun" class="block text-sm font-medium mb-1.5">Tahun ajaran</label>
        <input id="fTahun" name="tahun_ajaran" class="medan font-data" required
               placeholder="2025-2026" pattern="\d{4}-\d{4}">
        <p class="text-xs text-tinta-redup mt-1">Bentuknya 2025-2026.</p>
      </div>
      <div>
        <label for="fLokasi" class="block text-sm font-medium mb-1.5">Lokasi</label>
        <input id="fLokasi" name="lokasi" class="medan" placeholder="Desa atau kecamatan">
      </div>
      <div>
        <label for="fDosen" class="block text-sm font-medium mb-1.5">Dosen pembimbing</label>
        <select id="fDosen" name="lecturer_id" class="medan">
          <option value="">Belum ditentukan</option>
        </select>
        <p class="text-xs text-tinta-redup mt-1">
          Hanya dosen berstatus pembimbing lapangan yang bisa dipilih.
        </p>
      </div>
    </div>

    <div class="px-5 py-4 border-t border-garis flex gap-2 justify-end">
      <button type="button" id="tombolBatal" class="tombol-halus">Batal</button>
      <button type="submit" id="tombolSimpan" class="tombol-utama">Simpan</button>
    </div>
  </form>
</aside>

<script type="module">
import { getJSON, postJSON, deleteJSON } from "/assets/js/jscroot/api.js";
import { backend } from "/assets/js/config.js";
import { requireLogin, tokenHeader } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { buat as buatLaci } from "/assets/js/laci.js";
import { el, sel, opsi, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Kelompok KKN");

    const isi = document.getElementById("isiTabel");
    const elPesan = document.getElementById("pesan");
    const ringkasan = document.getElementById("ringkasan");
    const segmen = document.getElementById("segmenTahun");
    const inpCari = document.getElementById("cari");
    const form = document.getElementById("formKelompok");
    const laci = buatLaci("laci", "tirai", "tombolBatal");
    let tahun = "", sunting = null, halaman = 1, totalHalaman = 1;

    const kakiHal = document.getElementById("kakiHalaman");
    const posisi = document.getElementById("posisiHalaman");
    const btnPrev = document.getElementById("sebelumnya");
    const btnNext = document.getElementById("berikutnya");

    // Tanpa tahun terpilih ada 202 kelompok — dua lebih banyak daripada
    // plafon `limit` di server. Dulu halaman ini meminta 200 tanpa kontrol
    // halaman, jadi dua kelompok terakhir tidak pernah muncul.
    const SEHALAMAN = 200;

    function baris(g) {
        const tr = el("tr");
        tr.appendChild(sel(String(g.kelompok || "").replace(/^kelompok\s+/i, ""), "kode"));

        // Jumlah anggota: angka yang paling dicari saat menempatkan. Nol
        // ditandai — kelompok kosong biasanya berarti pekerjaan yang belum
        // selesai, bukan keadaan yang wajar.
        const n = g.jumlah_anggota || 0;
        const tdN = el("td", "text-right whitespace-nowrap");
        tdN.appendChild(el("span", "font-data text-sm tabular-nums" + (n ? "" : " text-tinta-samar"), n));
        tr.appendChild(tdN);

        tr.appendChild(sel(g.lokasi));

        // Kelompok tanpa pembimbing ditandai, tidak cuma dibiarkan bergaris.
        // Itu daftar pekerjaan yang tersembunyi di dalam tabel.
        if (g.nama_dosen) {
            tr.appendChild(sel(g.nama_dosen, "text-sm"));
        } else {
            const td = el("td");
            td.appendChild(el("span", "tanda is-belum", "belum ada DPL"));
            tr.appendChild(td);
        }
        tr.appendChild(sel(g.nidn, "kode hidden sm:table-cell"));
        tr.appendChild(sel(g.tahun_ajaran, "kode whitespace-nowrap"));

        const td = el("td", "text-right whitespace-nowrap");
        const ubah = el("button", "tautan-aksi", "Ubah");
        ubah.type = "button";
        ubah.addEventListener("click", function () { bukaForm(g); });
        const hapus = el("button", "tautan-aksi tautan-aksi--bahaya ml-3", "Hapus");
        hapus.type = "button";
        hapus.addEventListener("click", function () { hapusKelompok(g); });
        td.appendChild(ubah);
        td.appendChild(hapus);
        tr.appendChild(td);
        return tr;
    }

    function muat() {
        sembunyikan(elPesan);
        kosongkan(isi);
        const p = new URLSearchParams({ limit: String(SEHALAMAN), page: String(halaman) });
        if (tahun) p.set("tahun_ajaran", tahun);
        if (inpCari.value.trim()) p.set("q", inpCari.value.trim());
        getJSON(backend.kkn.groups + "?" + p.toString(), jawabanMuat, ...tokenHeader());
    }

    function jawabanMuat(hasil) {
        if (!sehat(hasil, elPesan)) return;
        const amplop = hasil.data || {};
        const rows = amplop.data || [];
        if (!rows.length) {
            const tr = el("tr");
            const td = el("td", "text-center py-10 text-tinta-redup text-sm",
                "Belum ada kelompok yang cocok.");
            td.colSpan = 6;
            tr.appendChild(td);
            isi.appendChild(tr);
        } else {
            rows.forEach(function (g) { isi.appendChild(baris(g)); });
        }
        const meta = amplop.meta || {};
        ringkasan.textContent = (meta.total || 0).toLocaleString("id-ID") + " kelompok";
        totalHalaman = meta.total_pages || 1;
        if (totalHalaman <= 1) {
            kakiHal.hidden = true;
        } else {
            kakiHal.hidden = false;
            posisi.textContent = "Halaman " + (meta.page || 1) + " dari " + totalHalaman;
            btnPrev.disabled = (meta.page || 1) <= 1;
            btnNext.disabled = (meta.page || 1) >= totalHalaman;
        }
    }

    function muatDosen() {
        const pilihan = document.getElementById("fDosen");
        // Hanya DPL — server juga menolak yang bukan, tapi menawarkan
        // pilihan yang pasti ditolak itu menjebak.
        getJSON(backend.master.lecturers + "?dpl=1&limit=200", function (hasil) {
            // Pilihan opsional: kalau gagal, formulirnya tetap bisa dibuka.
            if (!hasil || hasil.status !== 200) return;
            ((hasil.data || {}).data || []).forEach(function (d) {
                pilihan.appendChild(opsi(d.id, d.name + (d.nidn ? " · " + d.nidn : "")));
            });
        }, ...tokenHeader());
    }

    function bukaForm(g) {
        sunting = g || null;
        document.getElementById("judulLaci").textContent = g ? "Ubah kelompok" : "Tambah kelompok";
        form.kelompok.value = g ? String(g.kelompok || "").replace(/^kelompok\s+/i, "") : "";
        form.tahun_ajaran.value = g ? (g.tahun_ajaran || "") : (tahun || "");
        form.lokasi.value = g ? (g.lokasi || "") : "";
        form.lecturer_id.value = g ? (g.lecturer_id || "") : "";
        sembunyikan(document.getElementById("pesanLaci"));
        laci.buka();
    }

    document.getElementById("tombolTambah").addEventListener("click", function () { bukaForm(null); });

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        const pl = document.getElementById("pesanLaci");
        sembunyikan(pl);
        const tombol = document.getElementById("tombolSimpan");
        tombol.disabled = true;

        const jalur = backend.kkn.groups + (sunting ? "?id=" + encodeURIComponent(sunting.id) : "");
        postJSON(jalur, {
            kelompok: form.kelompok.value.trim(),
            tahun_ajaran: form.tahun_ajaran.value.trim(),
            lokasi: form.lokasi.value.trim(),
            lecturer_id: form.lecturer_id.value,
        }, function (hasil) {
            tombol.disabled = false;
            if (!sehat(hasil, pl)) return;
            laci.tutup();
            muat();
        }, ...tokenHeader());
    });

    function hapusKelompok(g) {
        if (!window.confirm("Hapus kelompok " + g.kelompok + "?")) return;
        deleteJSON(backend.kkn.group(encodeURIComponent(g.id)), {}, function (hasil) {
            // Kelompok yang masih berisi peserta ditolak server; pesannya
            // menyebut berapa peserta, dan sehat() meneruskannya apa adanya.
            if (!sehat(hasil, elPesan)) return;
            muat();
        }, ...tokenHeader());
    }

    btnPrev.addEventListener("click", function () { if (halaman > 1) { halaman--; muat(); } });
    btnNext.addEventListener("click", function () { if (halaman < totalHalaman) { halaman++; muat(); } });

    function tombolTahun(nilai, label) {
        const b = el("button", "", label);
        b.type = "button";
        b.dataset.nilai = nilai;
        b.setAttribute("aria-pressed", String(tahun === nilai));
        b.addEventListener("click", function () {
            tahun = nilai;
            halaman = 1;
            segmen.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.nilai === nilai));
            });
            muat();
        });
        return b;
    }

    function muatTahun() {
        segmen.appendChild(tombolTahun("", "Semua"));
        getJSON(backend.master.academicYears, function (hasil) {
            if (!hasil || hasil.status !== 200) return;   // opsional
            ((hasil.data || {}).data || []).forEach(function (ta) {
                segmen.appendChild(tombolTahun(ta, ta));
            });
        }, ...tokenHeader());
    }

    let jeda;
    inpCari.addEventListener("input", function () {
        clearTimeout(jeda);
        jeda = setTimeout(function () { halaman = 1; muat(); }, 350);
    });

    muatTahun();
    muatDosen();
    muat();
}
</script>
</body>
</html>
