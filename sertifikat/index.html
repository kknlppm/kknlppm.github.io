<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Sertifikat — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1200px] mx-auto px-5 py-5">

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div id="segmenTahun" class="segmen" role="group" aria-label="Tahun ajaran"></div>
    <div id="segmenStatus" class="segmen" role="group" aria-label="Status sertifikat">
      <button type="button" data-status="siap" aria-pressed="true">Siap terbit</button>
      <button type="button" data-status="terbit" aria-pressed="false">Sudah terbit</button>
    </div>
    <div class="flex-1 min-w-[12rem]">
      <label for="cari" class="sr-only">Cari peserta</label>
      <input id="cari" type="search" class="medan" spellcheck="false" placeholder="NIM atau nama">
    </div>
    <output id="ringkasan" class="font-data text-xs text-tinta-redup whitespace-nowrap"></output>
  </div>

  <!-- Papan tindakan massal. Muncul hanya kalau ada yang dipilih — tombol
       yang tidak bisa dipakai lebih baik tidak digambar daripada digambar
       lalu dimatikan. -->
  <div id="papanMassal" hidden
       class="flex flex-wrap items-center gap-3 mb-4 rounded-xl bg-bata-muda px-4 py-3">
    <output id="terpilih" class="text-sm font-medium"></output>
    <button id="terbitkanMassal" type="button" class="tombol-utama">Terbitkan semua yang dipilih</button>
    <button id="batalPilih" type="button" class="tombol-halus">Batalkan pilihan</button>
    <progress id="majuMassal" hidden class="w-40 h-1.5"></progress>
  </div>

  <p class="text-sm text-tinta-redup mb-4" id="keteranganTapis">
    Peserta yang sudah punya nilai KKN tapi sertifikatnya belum diterbitkan.
  </p>

  <div id="pesan" hidden role="alert"></div>

  <div class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-17rem)]">
      <table class="register">
        <thead>
          <tr>
            <th class="w-10"><input id="pilihSemua" type="checkbox"
                class="w-4 h-4 accent-bata" aria-label="Pilih semua di halaman ini"></th>
            <th>NIM</th>
            <th>Nama</th>
            <th class="hidden md:table-cell">Kelompok</th>
            <th>TA</th>
            <th class="text-right">Nilai</th>
            <th class="text-right">Tindakan</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <nav id="kakiHalaman" class="flex items-center justify-between gap-3 mt-4" aria-label="Halaman" hidden>
    <button id="sebelumnya" type="button" class="tombol-halus" disabled>← Sebelumnya</button>
    <span id="posisiHalaman" class="font-data text-xs text-tinta-redup"></span>
    <button id="berikutnya" type="button" class="tombol-halus" disabled>Berikutnya →</button>
  </nav>
</main>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { backend, tokenKey } from "/assets/js/config.js";
import { requireLogin, tokenHeader, getToken } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { el, sel, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Sertifikat KKN");

    const isi = document.getElementById("isiTabel");
    const elPesan = document.getElementById("pesan");
    const ringkasan = document.getElementById("ringkasan");
    const ket = document.getElementById("keteranganTapis");
    const segTahun = document.getElementById("segmenTahun");
    const segStatus = document.getElementById("segmenStatus");
    const inpCari = document.getElementById("cari");
    let tahun = "", status = "siap", halaman = 1, totalHalaman = 1;

    const kakiHal = document.getElementById("kakiHalaman");
    const posisi = document.getElementById("posisiHalaman");
    const btnPrev = document.getElementById("sebelumnya");
    const btnNext = document.getElementById("berikutnya");

    // Tanpa tahun terpilih ada 1.310 keikutsertaan yang siap terbit. Dulu
    // halaman ini meminta 100 tanpa kontrol halaman: 1.210 di antaranya tidak
    // bisa dijangkau sama sekali, dan petugas sertifikat tidak punya cara tahu
    // selain membaca angka ringkasannya.
    const SEHALAMAN = 100;

    // Yang dipilih disimpan sebagai Map id -> baris, bukan sebagai daftar id:
    // saat menerbitkan kita butuh namanya untuk pesan, dan rujukan barisnya
    // untuk memperbaruinya di tempat.
    const dipilih = new Map();
    const papan = document.getElementById("papanMassal");
    const elTerpilih = document.getElementById("terpilih");
    const maju = document.getElementById("majuMassal");
    const cekSemua = document.getElementById("pilihSemua");

    function tombolUnduh(r) {
        // Dibuka di tab baru, bukan diunduh paksa: orang biasanya ingin
        // MELIHAT sertifikatnya dulu sebelum menyimpannya.
        const a = el("a", "tautan-aksi", "Lihat PDF");
        a.href = backend.certificate.pdf(encodeURIComponent(r.id));
        a.target = "_blank";
        a.rel = "noopener";
        a.addEventListener("click", async function (e) {
            // Berkas PDF butuh header token, dan tautan biasa tidak
            // membawanya. Jadi diambil sebagai blob lalu dibuka.
            //
            // Ditulis tangan, TIDAK memakai pembantu berkas jscroot, dan itu
            // disengaja: `getFileWithHeader` memaksa unduh lewat a.download
            // (bukan membuka, yang justru maunya di sini), dan
            // `getFileBytesWithHeader` mengembalikan arrayBuffer ke rantai
            // .then yang tidak punya penerima — pada status 200 bytes-nya
            // hilang dan callback-nya tidak pernah dipanggil.
            e.preventDefault();
            try {
                const res = await fetch(a.href, { headers: { [tokenKey]: getToken() } });
                if (!res.ok) throw new Error("Gagal mengambil sertifikat.");
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                window.open(url, "_blank", "noopener");
                setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            } catch (err) {
                pesan(elPesan, err.message || "Gagal membuka sertifikat.", "galat");
            }
        });
        return a;
    }

    function segarkanPapan() {
        const n = dipilih.size;
        papan.hidden = n === 0;
        elTerpilih.textContent = n + " peserta dipilih";
        const kotak = isi.querySelectorAll('input[type="checkbox"]');
        const bisa = isi.querySelectorAll('input[type="checkbox"]:not([disabled])');
        cekSemua.checked = bisa.length > 0 && n >= bisa.length;
        cekSemua.indeterminate = n > 0 && n < bisa.length;
        cekSemua.disabled = kotak.length === 0 || bisa.length === 0;
    }

    function baris(r) {
        const tr = el("tr");
        r.__tr = tr;

        // Hanya yang BELUM bersertifikat bisa dipilih. Yang sudah terbit
        // nomornya tidak berubah lagi, jadi memilihnya tidak berarti apa-apa.
        const tdCek = el("td");
        const cek = document.createElement("input");
        cek.type = "checkbox";
        cek.className = "w-4 h-4 accent-bata";
        cek.setAttribute("aria-label", "Pilih " + r.name);
        cek.disabled = !!r.has_cert;
        cek.checked = dipilih.has(r.id);
        cek.addEventListener("change", function () {
            if (cek.checked) dipilih.set(r.id, r); else dipilih.delete(r.id);
            segarkanPapan();
        });
        tdCek.appendChild(cek);
        tr.appendChild(tdCek);

        tr.appendChild(sel(r.nim, "kode whitespace-nowrap"));
        tr.appendChild(sel(r.name, "font-medium"));
        tr.appendChild(sel(String(r.kelompok || "").replace(/^kelompok\s+/i, ""), "kode hidden md:table-cell"));
        tr.appendChild(sel(r.tahun_ajaran, "kode whitespace-nowrap"));

        const tdNilai = el("td", "text-right whitespace-nowrap");
        tdNilai.appendChild(el("span", "font-data text-sm tabular-nums", r.nilai || "—"));
        if (r.huruf) tdNilai.appendChild(el("span", "huruf-mutu text-bata ml-1.5", r.huruf));
        tr.appendChild(tdNilai);

        const td = el("td", "text-right whitespace-nowrap");
        if (r.has_cert) {
            td.appendChild(tombolUnduh(r));
        } else {
            const b = el("button", "tombol-halus h-7 px-3 text-xs", "Terbitkan");
            b.type = "button";
            b.addEventListener("click", async function () {
                b.disabled = true;
                b.textContent = "Menerbitkan…";
                // Jalurnya sama dengan penerbitan massal — satu fungsi, satu
                // perilaku. Kalau dipisah, yang satu akan diperbaiki dan yang
                // lain tertinggal.
                const h = await terbitSatu(r);
                if (h.ok) {
                    pesan(elPesan, "Sertifikat " + (r.no_sertifikat || "") +
                        " diterbitkan untuk " + r.name + ".", "sah");
                } else {
                    b.disabled = false;
                    b.textContent = "Terbitkan";
                    pesan(elPesan, "Gagal menerbitkan untuk " + r.name + ": " + h.sebab, "galat");
                }
            });
            td.appendChild(b);
        }
        tr.appendChild(td);
        return tr;
    }

    // tandaiTerbit memperbarui satu baris di tempat sesudah sertifikatnya
    // terbit. Kalau saringannya "siap terbit", barisnya memang harus pergi.
    function tandaiTerbit(r, no) {
        r.has_cert = true;
        r.no_sertifikat = no;
        dipilih.delete(r.id);
        const tr = r.__tr;
        if (!tr || !tr.parentNode) { segarkanPapan(); return; }
        if (status === "siap") {
            tr.remove();
            if (!isi.querySelectorAll("tr").length) {
                const t = el("tr");
                const d = el("td", "text-center py-10 text-tinta-redup text-sm",
                    "Tidak ada yang siap diterbitkan pada tapisan ini.");
                d.colSpan = 7; t.appendChild(d); isi.appendChild(t);
            }
        } else {
            tr.replaceWith(baris(r));
        }
        segarkanPapan();
    }

    // terbitSatu mengembalikan Promise supaya penerbitan massal bisa
    // menjalankannya BERURUTAN. Serentak akan menabrak penomoran sertifikat:
    // nomornya diambil dari urutan terakhir, dan dua permintaan bersamaan
    // bisa mendapat nomor yang sama.
    function terbitSatu(r) {
        return new Promise(function (selesai) {
            postJSON(backend.certificate.issue(encodeURIComponent(r.id)), {}, function (hasil) {
                if (!hasil || typeof hasil.status !== "number") { selesai({ ok: false, sebab: "tidak ada jawaban server" }); return; }
                if (hasil.status === 401) { sehat(hasil, elPesan); selesai({ ok: false, sebab: "sesi habis" }); return; }
                const amplop = hasil.data || {};
                if (hasil.status < 200 || hasil.status >= 300) {
                    selesai({ ok: false, sebab: amplop.message || ("HTTP " + hasil.status) });
                    return;
                }
                tandaiTerbit(r, (amplop.data || {}).no_sertifikat);
                selesai({ ok: true });
            }, ...tokenHeader());
        });
    }

    function muat() {
        kosongkan(isi);
        ket.textContent = status === "siap"
            ? "Peserta yang sudah punya nilai KKN tapi sertifikatnya belum diterbitkan."
            : "Peserta yang sertifikatnya sudah terbit. Nomor dan tokennya tidak berubah lagi.";

        // Disaring di SERVER, bukan di sini. Hanya 139 dari 1.778
        // keikutsertaan punya sertifikat; menyaring satu halaman hasil di
        // peramban membuat "sudah terbit" hampir selalu kosong.
        const p = new URLSearchParams({ limit: String(SEHALAMAN), page: String(halaman), cert: status });
        if (tahun) p.set("tahun_ajaran", tahun);
        if (inpCari.value.trim()) p.set("q", inpCari.value.trim());

        getJSON(backend.kkn.participations + "?" + p.toString(), function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            const amplop = hasil.data || {};
            const rows = amplop.data || [];
            if (!rows.length) {
                const tr = el("tr");
                const td = el("td", "text-center py-10 text-tinta-redup text-sm",
                    status === "siap"
                        ? "Tidak ada yang siap diterbitkan pada tapisan ini."
                        : "Belum ada sertifikat terbit pada tapisan ini.");
                td.colSpan = 7;
                tr.appendChild(td);
                isi.appendChild(tr);
            } else {
                rows.forEach(function (r) { isi.appendChild(baris(r)); });
            }
            // Pilihan yang barisnya sudah tidak ada lagi harus dibuang,
            // kalau tidak papan menghitung orang yang tidak terlihat.
            const adaSekarang = new Set(rows.map(function (x) { return x.id; }));
            Array.from(dipilih.keys()).forEach(function (id) {
                if (!adaSekarang.has(id)) dipilih.delete(id);
            });
            segarkanPapan();

            const meta = amplop.meta || {};
            const total = meta.total || rows.length;
            ringkasan.textContent = total.toLocaleString("id-ID") + " peserta";
            totalHalaman = meta.total_pages || 1;
            if (totalHalaman <= 1) {
                kakiHal.hidden = true;
            } else {
                kakiHal.hidden = false;
                posisi.textContent = "Halaman " + (meta.page || 1) + " dari " + totalHalaman;
                btnPrev.disabled = (meta.page || 1) <= 1;
                btnNext.disabled = (meta.page || 1) >= totalHalaman;
            }
        }, ...tokenHeader());
    }

    btnPrev.addEventListener("click", function () { if (halaman > 1) { halaman--; muat(); } });
    btnNext.addEventListener("click", function () { if (halaman < totalHalaman) { halaman++; muat(); } });

    segStatus.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
            status = b.dataset.status;
            halaman = 1;
            segStatus.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.status === status));
            });
            muat();
        });
    });

    function tombolTahun(nilai, label) {
        const b = el("button", "", label);
        b.type = "button";
        b.dataset.nilai = nilai;
        b.setAttribute("aria-pressed", String(tahun === nilai));
        b.addEventListener("click", function () {
            tahun = nilai;
            halaman = 1;
            segTahun.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.nilai === nilai));
            });
            muat();
        });
        return b;
    }

    function muatTahun() {
        segTahun.appendChild(tombolTahun("", "Semua"));
        getJSON(backend.master.academicYears, function (hasil) {
            if (!hasil || hasil.status !== 200) return;   // opsional
            ((hasil.data || {}).data || []).forEach(function (ta) {
                segTahun.appendChild(tombolTahun(ta, ta));
            });
        }, ...tokenHeader());
    }

    let jeda;
    inpCari.addEventListener("input", function () {
        clearTimeout(jeda);
        jeda = setTimeout(function () { halaman = 1; muat(); }, 350);
    });

    // ── penerbitan massal ──
    cekSemua.addEventListener("change", function () {
        // Keadaan tujuan DIREKAM dulu. Tiap c.click() memanggil
        // segarkanPapan(), yang menulis ulang cekSemua.checked — membacanya
        // di dalam gelung berarti membaca nilai yang baru saja diubah gelung
        // itu sendiri, dan "pilih semua" hanya memilih satu.
        const mau = cekSemua.checked;
        isi.querySelectorAll('input[type="checkbox"]:not([disabled])').forEach(function (c) {
            if (c.checked !== mau) c.click();
        });
        cekSemua.checked = mau;
    });
    document.getElementById("batalPilih").addEventListener("click", function () {
        dipilih.clear();
        isi.querySelectorAll('input[type="checkbox"]').forEach(function (c) { c.checked = false; });
        segarkanPapan();
    });

    document.getElementById("terbitkanMassal").addEventListener("click", async function () {
        const daftar = Array.from(dipilih.values());
        if (!daftar.length) return;
        if (!window.confirm("Terbitkan " + daftar.length + " sertifikat? Nomor yang sudah terbit tidak bisa diubah lagi.")) return;

        const tombol = this;
        tombol.disabled = true;
        maju.hidden = false;
        maju.max = daftar.length;
        maju.value = 0;

        // BERURUTAN, bukan serentak. Nomor sertifikat diambil dari urutan
        // terakhir di basis data; dua permintaan bersamaan bisa membaca
        // urutan yang sama dan menerbitkan dua nomor kembar — dan nomor
        // sertifikat tidak bisa diperbaiki sesudah tercetak.
        let sukses = 0;
        const gagal = [];
        for (const r of daftar) {
            const h = await terbitSatu(r);
            if (h.ok) sukses++; else gagal.push(r.name + " (" + h.sebab + ")");
            maju.value = sukses + gagal.length;
        }

        tombol.disabled = false;
        maju.hidden = true;
        if (!gagal.length) {
            pesan(elPesan, sukses + " sertifikat diterbitkan.", "sah");
        } else {
            // Yang gagal disebut satu per satu. "Sebagian gagal" tanpa nama
            // memaksa orang mencocokkan sendiri empat puluh baris.
            pesan(elPesan, sukses + " berhasil, " + gagal.length + " gagal: " +
                gagal.slice(0, 5).join("; ") + (gagal.length > 5 ? ", dan lainnya" : ""), "galat");
        }
        ringkasan.textContent = "";
        muat();
    });

    muatTahun();
    muat();
}
</script>
</body>
</html>
