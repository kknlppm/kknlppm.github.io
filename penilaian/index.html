<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Penilaian KKN — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema dipasang SEBELUM stylesheet supaya halaman gelap tidak berkedip putih. -->
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1060px] mx-auto px-5 py-5">

  <!-- Pekerjaan dosen berbentuk per KELOMPOK, bukan per mahasiswa: satu
       kelompok dinilai sekaligus dalam satu duduk. Karena itu kelompok yang
       dipilih lebih dulu, baru anggotanya muncul. -->
  <div class="flex flex-wrap items-end gap-3 mb-4">
    <div>
      <label for="pilihTahun" class="block eyebrow text-tinta-redup mb-1.5">Tahun akademik</label>
      <select id="pilihTahun" class="medan font-data w-40"></select>
    </div>
    <div class="flex-1 min-w-[16rem]">
      <label for="pilihKelompok" class="block eyebrow text-tinta-redup mb-1.5">Kelompok</label>
      <select id="pilihKelompok" class="medan w-full">
        <option value="">Pilih kelompok…</option>
      </select>
    </div>
    <output id="ringkasKelompok" class="font-data text-xs text-tinta-redup pb-2.5"></output>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div id="kosong">
    <p class="text-sm text-tinta-redup mb-3">
      Pilih kelompok untuk mulai menilai. Nilai akhir dihitung sendiri dari lima
      aspek: rata-rata H, S, L, QP, dan QL.
    </p>
    <!-- Dulu di sini ada kotak kosong setinggi 250px dengan 800px ruang mati di
         bawahnya, dan satu-satunya jalan ke pekerjaannya lewat dropdown yang
         menyembunyikan 41 kelompok. Kartunya digambar dari daftar yang MEMANG
         sudah diambil untuk mengisi dropdown itu — tanpa permintaan tambahan. -->
    <div id="petakKelompok" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    <p id="kosongTanpaKelompok" hidden
       class="bg-kertas rounded-2xl shadow-kartu px-8 py-16 text-center text-tinta-redup">
      Tidak ada kelompok di tahun akademik ini.
    </p>
  </div>

  <div id="wadahTabel" hidden class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-15rem)]">
      <table class="register">
        <thead>
          <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th class="text-center w-16">H</th>
            <th class="text-center w-16">S</th>
            <th class="text-center w-16">L</th>
            <th class="text-center w-16">QP</th>
            <th class="text-center w-16">QL</th>
            <th class="w-24">Aspek</th>
            <th class="text-right w-24">Nilai</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
    <p class="px-4 py-2.5 border-t border-garis-tipis text-xs text-tinta-redup">
      Satu baris tersimpan sekali, begitu Anda pindah ke baris lain. Enter turun satu baris. Rentang 0–100.
    </p>
  </div>
</main>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { backend } from "/assets/js/config.js";
import { requireLogin, tokenHeader } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { el, sel, opsi, deretNilai, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Penilaian KKN", "Lima aspek · H · S · L · QP · QL");

    const selTahun = document.getElementById("pilihTahun");
    const selKel = document.getElementById("pilihKelompok");
    const ringkas = document.getElementById("ringkasKelompok");
    const isi = document.getElementById("isiTabel");
    const wadah = document.getElementById("wadahTabel");
    const kosong = document.getElementById("kosong");
    const petak = document.getElementById("petakKelompok");
    const tanpaKelompok = document.getElementById("kosongTanpaKelompok");

    // gambarPetak menggambar satu kartu per kelompok. Menekan kartu sama
    // dengan memilihnya di dropdown — dropdown tetap ada karena ia yang
    // dipakai untuk BERPINDAH kelompok setelah tabelnya terbuka.
    function gambarPetak(daftar) {
        kosongkan(petak);
        tanpaKelompok.hidden = daftar.length > 0;
        daftar.forEach(function (g) {
            const b = el("button", "kartu-kelompok");
            b.type = "button";
            const atas = el("div", "flex items-baseline justify-between gap-2");
            atas.appendChild(el("span", "font-medium",
                String(g.kelompok || "").replace(/^kelompok\s+/i, "Kelompok ") || "Kelompok"));
            atas.appendChild(el("span", "font-data text-xs text-tinta-redup shrink-0",
                (g.jumlah_anggota || 0) + " org"));
            b.appendChild(atas);
            const lokasi = String(g.lokasi || "").trim();
            b.appendChild(el("div", "text-xs text-tinta-redup mt-1 truncate", lokasi || "—"));
            b.appendChild(el("div", "text-xs text-tinta-samar mt-0.5 truncate", g.nama_dosen || "—"));
            // Kemajuan: berapa anggota yang sudah dinilai. Hanya digambar kalau
            // server mengirimnya, supaya backend lama tidak membuat kartu
            // berkata "0 / 10 dinilai" untuk kelompok yang sudah selesai.
            const n = g.jumlah_anggota || 0, d = g.jumlah_dinilai;
            if (typeof d === "number" && n > 0) {
                const baris = el("div", "flex items-center gap-2 mt-2.5");
                const bar = el("span", "kemajuan" + (d >= n ? " kemajuan--selesai" : ""));
                const isiBar = el("i");
                isiBar.style.width = Math.round(100 * Math.min(d, n) / n) + "%";
                bar.appendChild(isiBar);
                baris.appendChild(bar);
                baris.appendChild(el("span", "font-data text-mikro text-tinta-redup shrink-0",
                    Math.min(d, n) + " / " + n + " dinilai"));
                b.appendChild(baris);
            }
            b.title = [lokasi, g.nama_dosen].filter(Boolean).join(" · ");
            b.addEventListener("click", function () {
                selKel.value = g.id;
                muatAnggota();
            });
            petak.appendChild(b);
        });
    }
    const elPesan = document.getElementById("pesan");

    const ASPEK = ["nilai_h", "nilai_s", "nilai_l", "nilai_qp", "nilai_ql"];

    function hurufDari(n) {
        // Disalin dari aturan aplikasi lama, termasuk celah di angka 44 yang
        // tidak menghasilkan huruf apa pun. Server tetap yang berwenang;
        // ini hanya supaya layar tidak berkedip menunggu jawaban.
        if (n >= 80) return "A";
        if (n >= 68 && n <= 79) return "B";
        if (n >= 56 && n <= 67) return "C";
        if (n >= 45 && n <= 55) return "D";
        if (n < 44) return "E";
        return "";
    }

    function gambarDeret(td, r) {
        kosongkan(td);
        td.appendChild(deretNilai(r).firstChild);
    }

    function simpanBaris(r, tr) {
        const t = tr.__tertunda;
        const kunci = Object.keys(t);
        if (!kunci.length) return;
        if (tr.querySelector(".kotak-nilai.salah")) {
            pesan(elPesan, "Nilai harus bilangan bulat 0 sampai 100.", "galat");
            return;
        }
        const kirim = {};
        kunci.forEach(function (k) { kirim[k] = t[k]; });
        tr.classList.remove("baris-tertunda");
        tr.classList.add("baris-menyimpan");

        postJSON(backend.kkn.gradesKkn, { id: r.id, nilai5: kirim }, function (hasil) {
            tr.classList.remove("baris-menyimpan");
            if (!sehat(hasil, elPesan)) {
                // Baris ditandai supaya penilai tahu angka di layar TIDAK
                // tersimpan di server. Yang tertunda sengaja TIDAK dibuang:
                // meninggalkan lalu kembali ke baris itu mencoba lagi.
                tr.classList.add("baris-gagal");
                return;
            }
            tr.classList.remove("baris-gagal");
            kunci.forEach(function (k) { r[k] = t[k]; delete t[k]; });
            r.nilai = ((hasil.data || {}).data || {}).nilai;
            tr.__segarkan(r);
            sembunyikan(elPesan);
            tr.classList.add("baris-tersimpan");
            setTimeout(function () { tr.classList.remove("baris-tersimpan"); }, 1600);
        }, ...tokenHeader());
    }

    function baris(r) {
        const tr = el("tr");
        tr.dataset.id = r.id;
        // Yang diubah tapi belum terkirim, per baris.
        const tertunda = {};
        tr.__tertunda = tertunda;
        tr.appendChild(sel(r.nim, "kode whitespace-nowrap"));
        tr.appendChild(sel(r.name, "font-medium"));

        const tdDeret = el("td");
        const tdNilai = el("td", "text-right whitespace-nowrap");

        tr.__segarkan = segarkan;
        function segarkan(data) {
            gambarDeret(tdDeret, data);
            kosongkan(tdNilai);
            if (data.nilai > 0) {
                tdNilai.appendChild(el("span", "font-data text-sm tabular-nums", data.nilai));
                tdNilai.appendChild(el("span", "huruf-mutu text-bata ml-1.5", hurufDari(data.nilai)));
            } else {
                tdNilai.appendChild(el("span", "text-tinta-samar", "—"));
            }
        }

        ASPEK.forEach(function (aspek) {
            const td = el("td", "text-center p-1");
            const inp = document.createElement("input");
            inp.type = "number";
            inp.min = "0"; inp.max = "100"; inp.step = "1";
            inp.className = "kotak-nilai";
            inp.value = r[aspek] || "";
            inp.setAttribute("aria-label", aspek.replace("nilai_", "").toUpperCase() + " untuk " + r.name);

            inp.dataset.aspek = aspek;

            inp.addEventListener("input", function () {
                const nilai = inp.value === "" ? 0 : Number(inp.value);
                if (!Number.isInteger(nilai) || nilai < 0 || nilai > 100) {
                    inp.classList.add("salah");
                    return;
                }
                inp.classList.remove("salah");
                // Hanya dicatat; kirimannya menunggu seluruh baris selesai.
                if (nilai !== (r[aspek] || 0)) tertunda[aspek] = nilai;
                else delete tertunda[aspek];
                tr.classList.toggle("baris-tertunda", Object.keys(tertunda).length > 0);
            });

            // Enter turun satu baris di kolom yang sama. Dosen mengisi
            // menurun per aspek, bukan menyamping per mahasiswa.
            inp.addEventListener("keydown", function (e) {
                if (e.key !== "Enter") return;
                e.preventDefault();
                const berikut = tr.nextElementSibling;
                const sasaran = berikut && berikut.querySelector('[data-aspek="' + aspek + '"]');
                if (sasaran) sasaran.focus(); else inp.blur();
            });

            td.appendChild(inp);
            tr.appendChild(td);
        });

        // Disimpan saat fokus MENINGGALKAN baris, sekali untuk kelima kotak.
        //
        // Sebelumnya tiap kotak mengirim permintaannya sendiri: lima per
        // mahasiswa, 60 untuk kelompok berisi 12 — dan 60 kesempatan gagal
        // satu per satu di lokasi KKN yang sinyalnya buruk. Sekarang satu
        // baris = satu permintaan.
        tr.addEventListener("focusout", function (e) {
            if (tr.contains(e.relatedTarget)) return;   // masih di baris ini
            simpanBaris(r, tr);
        });

        tr.appendChild(tdDeret);
        tr.appendChild(tdNilai);
        segarkan(r);
        return tr;
    }

    function muatAnggota() {
        const idKel = selKel.value;
        if (!idKel) {
            wadah.hidden = true;
            kosong.hidden = false;
            ringkas.textContent = "";
            return;
        }
        kosong.hidden = true;
        wadah.hidden = false;
        kosongkan(isi);

        getJSON(backend.kkn.participations + "?limit=200&group_id=" + encodeURIComponent(idKel),
            function (hasil) {
                if (!sehat(hasil, elPesan)) return;
                const rows = (hasil.data || {}).data || [];
                if (!rows.length) {
                    const tr = el("tr");
                    const td = el("td", "text-center py-10 text-tinta-redup text-sm",
                        "Kelompok ini belum punya anggota.");
                    td.colSpan = 9;
                    tr.appendChild(td);
                    isi.appendChild(tr);
                    ringkas.textContent = "";
                    return;
                }
                rows.forEach(function (r) { isi.appendChild(baris(r)); });
                const dinilai = rows.filter(function (r) { return r.nilai > 0; }).length;
                ringkas.textContent = dinilai + " dari " + rows.length + " sudah dinilai";
            }, ...tokenHeader());
    }

    function muatKelompok() {
        const sebelumnya = selKel.value;
        kosongkan(selKel);
        selKel.appendChild(opsi("", "Pilih kelompok…"));

        const p = new URLSearchParams({ limit: "200" });
        if (selTahun.value) p.set("tahun_ajaran", selTahun.value);
        getJSON(backend.kkn.groups + "?" + p.toString(), function (hasil) {
            if (!sehat(hasil, elPesan)) { muatAnggota(); return; }
            const daftar = (hasil.data || {}).data || [];
            daftar.forEach(function (g) {
                selKel.appendChild(opsi(g.id,
                    String(g.kelompok).replace(/^kelompok\s+/i, "Kelompok ") +
                    (g.lokasi ? " — " + g.lokasi : "")));
            });
            if (!daftar.length) {
                selKel.appendChild(opsi("", "Tidak ada kelompok di tahun ini", true));
            }
            gambarPetak(daftar);
            // Kalau kelompok yang sedang dibuka masih ada di tahun yang baru
            // dipilih, ia tetap terbuka — berpindah tahun lalu kehilangan
            // tempat adalah gangguan, bukan fitur.
            if (sebelumnya && selKel.querySelector('option[value="' + sebelumnya + '"]')) {
                selKel.value = sebelumnya;
            }
            muatAnggota();
        }, ...tokenHeader());
    }

    function muatTahun() {
        getJSON(backend.master.academicYears, function (hasil) {
            // Saringan opsional; kalau gagal, kelompok tetap dimuat untuk
            // semua tahun.
            if (hasil && hasil.status === 200) {
                const daftar = (hasil.data || {}).data || [];
                daftar.forEach(function (ta) {
                    selTahun.appendChild(opsi(ta, ta));
                });
                // Tahun terbaru dipilih lebih dulu — itu yang sedang dikerjakan.
                if (daftar.length) selTahun.value = daftar[0];
            }
            muatKelompok();
        }, ...tokenHeader());
    }

    selTahun.addEventListener("change", muatKelompok);
    selKel.addEventListener("change", muatAnggota);
    muatTahun();
}
</script>
</body>
</html>
