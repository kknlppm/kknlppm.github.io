<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Berita, KKN LPPM Universitas Al-Ghifari</title>
  <meta name="description" content="Berita dan dokumentasi kegiatan KKN LPPM Universitas Al-Ghifari.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fajar.css">
</head>
<body class="halaman-terang">

<header class="bilah" id="bilah" data-tanah="terang">
  <div class="bilah__isi">
    <a class="bilah__merek" href="/">
      <img src="/assets/img/logo-unfari.png" alt="" width="20" height="19">
      <span>KKN&nbsp;LPPM</span>
    </a>
    <nav class="bilah__tautan" aria-label="Bagian halaman">
      <a href="/#tentang">Tentang</a>
      <a href="/#tahapan">Tahapan</a>
      <a href="/#kerja">Yang dikerjakan</a>
      <a href="/#berita">Berita</a>
      <a href="/#tanya">Tanya jawab</a>
    </nav>
    <div class="bilah__aksi">
      <a class="bilah__masuk" href="/login/">Masuk</a>
      <button class="bilah__burger" id="burger" type="button"
              aria-label="Buka menu" aria-expanded="false" aria-controls="menuPonsel">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="bilah__ponsel" id="menuPonsel" aria-label="Bagian halaman" hidden>
    <a href="/#tentang">Tentang</a>
    <a href="/#tahapan">Tahapan</a>
    <a href="/#kerja">Yang dikerjakan</a>
    <a href="/#berita">Berita</a>
    <a href="/#tanya">Tanya jawab</a>
    <a class="bilah__ponsel-masuk" href="/login/">Masuk ke aplikasi</a>
  </nav>
</header>

<main class="bab bab--terang artikel-halaman" data-tanah="terang">
  <div class="bungkus">
    <a class="artikel__kembali" href="/#berita">&larr; Semua berita</a>

    <div id="memuat" class="artikel__pesan">Memuat…</div>

    <article id="artikel" hidden>
      <h1 class="artikel__judul" id="judul"></h1>
      <div class="artikel__meta" id="meta"></div>
      <p class="artikel__ringkas" id="ringkasan" hidden></p>
      <div class="artikel__foto" id="foto" hidden></div>
      <div class="artikel__isi" id="isi"></div>
      <a class="btn btn--ghost artikel__tautan" id="tautan" hidden rel="noopener" target="_blank"></a>
    </article>
  </div>
</main>

<footer class="bab bab--terang" data-tanah="terang" style="padding-block:0">
  <div class="bungkus kolofon__bawah" style="margin-top:0">
    <span>&copy; <span id="tahunKini">2026</span> Universitas Al-Ghifari</span>
    <span>Register KKN &middot; LPPM</span>
  </div>
</footer>

<script type="module">
import { getJSON } from "/assets/js/jscroot/api.js";
import { getQueryString } from "/assets/js/jscroot/url.js";
import { backend } from "/assets/js/config.js";

// Halaman PUBLIK: tanpa token, dan sengaja tanpa ui.js:sehat() — pembaca yang
// tidak punya sesi tidak boleh dilempar ke /login/ hanya karena server diam.
//
// Semua teks digambar lewat textContent. Isinya diketik admin dan halaman ini
// satu origin dengan aplikasi yang menyimpan token di localStorage.

const $ = (s) => document.getElementById(s);
const el = (tag, kelas, teks) => {
    const e = document.createElement(tag);
    if (kelas) e.className = kelas;
    if (teks != null) e.textContent = String(teks);
    return e;
};

$("tahunKini").textContent = String(new Date().getFullYear());

function pesan(judul, keterangan) {
    const m = $("memuat");
    m.textContent = "";
    m.appendChild(el("b", null, judul));
    m.appendChild(document.createTextNode(keterangan));
    m.hidden = false;
}

function tanggalIndonesia(iso) {
    if (!iso) return "";
    const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
                   "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
}

function gambar(b) {
    $("memuat").hidden = true;
    $("artikel").hidden = false;

    $("judul").textContent = b.judul || "";
    document.title = (b.judul || "Berita") + " — KKN LPPM Universitas Al-Ghifari";

    const meta = $("meta");
    const tgl = tanggalIndonesia(b.tanggal_terbit);
    if (tgl) meta.appendChild(el("span", null, tgl));
    if (b.penulis) meta.appendChild(el("span", null, b.penulis));

    if (b.ringkasan) { $("ringkasan").textContent = b.ringkasan; $("ringkasan").hidden = false; }

    const foto = b.foto || [];
    if (foto.length) {
        const wadah = $("foto");
        foto.forEach((u) => {
            const img = document.createElement("img");
            // src diisi lewat properti, bukan disisipkan ke markup, dan
            // alt sengaja kosong: tidak ada takarir yang bisa dipercaya
            // menggambarkan isinya, dan alt karangan lebih buruk daripada
            // tidak ada bagi pembaca layar.
            img.src = u;
            img.alt = "";
            img.loading = "lazy";
            wadah.appendChild(img);
        });
        wadah.hidden = false;
    }

    const isi = $("isi");
    (b.paragraf || []).forEach((p) => isi.appendChild(el("p", null, p)));

    // Skema tautan sudah ditolak di server, dan diperiksa LAGI di sini.
    // Dua penjaga untuk hal yang sama itu disengaja: yang satu melindungi
    // data yang masuk, yang satu melindungi dari data yang terlanjur ada.
    if (b.tautan_url && /^https?:\/\//i.test(b.tautan_url)) {
        const t = $("tautan");
        t.href = b.tautan_url;
        t.textContent = b.tautan_label || "Selengkapnya";
        t.hidden = false;
    }
}

const slug = (getQueryString().slug || "").trim();
if (!slug) {
    pesan("Berita tidak ditemukan", "Alamatnya tidak menyebut berita mana yang dibuka.");
} else {
    let dijawab = false;
    const penjaga = setTimeout(() => {
        if (dijawab) return;
        dijawab = true;
        pesan("Belum bisa dimuat", "Server tidak terjangkau saat ini. Coba lagi sebentar lagi.");
    }, 10000);

    getJSON(backend.news.satuPublik(encodeURIComponent(slug)), (hasil) => {
        if (dijawab) return;
        dijawab = true;
        clearTimeout(penjaga);
        if (!hasil || typeof hasil.status !== "number") {
            pesan("Belum bisa dimuat", "Server tidak terjangkau saat ini.");
            return;
        }
        if (hasil.status === 404) {
            pesan("Berita tidak ditemukan", "Beritanya mungkin sudah dihapus atau belum diterbitkan.");
            return;
        }
        if (hasil.status !== 200) {
            pesan("Belum bisa dimuat", "Server menjawab dengan galat.");
            return;
        }
        gambar((hasil.data || {}).data || {});
    });
}
</script>
</body>
</html>
