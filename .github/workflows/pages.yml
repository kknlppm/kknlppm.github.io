# Deploy situs statis ke GitHub Pages.
#
# AKTIF sejak 4 September 2026, TAPI ke alamat bawaan GitHub — bukan ke
# kknlppm.unfari.ac.id.
#
# CNAME terpasang sejak 9 September 2026 (kknlppm.unfari.ac.id); lihat
# CATATAN-CNAME.md untuk riwayat pemindahannya.
#
# assets/js/config.js sudah memuat alamat GCF yang sebenarnya.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Buang node_modules sebelum unggah
        # node_modules TIDAK boleh ikut ke artifact Pages: besar, dan bukan
        # bagian dari situs. app.css sudah dibangun di langkah sebelumnya.
        run: rm -rf node_modules

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
