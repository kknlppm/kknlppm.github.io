<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Nilai mata kuliah — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1060px] mx-auto px-5 py-5">

  <!-- Bentuknya sengaja sama dengan Penilaian KKN: pilih dulu, baru daftar
       muncul. Yang berbeda hanya komponennya — empat, bukan lima. -->
  <div class="flex flex-wrap items-end gap-3 mb-4">
    <div class="flex-1 min-w-[18rem]">
      <label for="pilihMatkul" class="block eyebrow text-tinta-redup mb-1.5">Mata kuliah</label>
      <select id="pilihMatkul" class="medan w-full">
        <option value="">Pilih mata kuliah…</option>
      </select>
    </div>
    <output id="ringkas" class="font-data text-xs text-tinta-redup pb-2.5"></output>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div id="kosong" class="bg-kertas rounded-2xl shadow-kartu px-8 py-16 text-center">
    <p class="text-tinta-redup">Pilih mata kuliah untuk mulai menilai.</p>
    <p class="text-sm text-tinta-redup mt-2">
      Nilai akhir mata kuliah dihitung dari empat komponen: H, TL, UTS, dan UAS.
    </p>
  </div>

  <div id="wadahTabel" hidden class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-15rem)]">
      <table class="register">
        <thead>
          <tr>
            <th>NIM</th>
            <th>Nama</th>
            <th class="text-center w-16">H</th>
            <th class="text-center w-16">TL</th>
            <th class="text-center w-16">UTS</th>
            <th class="text-center w-16">UAS</th>
            <th class="text-right w-24">Nilai</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
    <p class="px-4 py-2.5 border-t border-garis-tipis text-xs text-tinta-redup">
      Nilai tersimpan begitu Anda pindah dari kotaknya. Rentang 0–100.
      Nilai akhir yang tersimpan menggabungkan nilai KKN mahasiswa 20%.
    </p>
  </div>
</main>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { backend, PERAN } from "/assets/js/config.js";
import { requireLogin, tokenHeader, getUser } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { el, sel, opsi, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Nilai mata kuliah", "Empat komponen · H · TL · UTS · UAS");

    const selMatkul = document.getElementById("pilihMatkul");
    const ringkas = document.getElementById("ringkas");
    const isi = document.getElementById("isiTabel");
    const wadah = document.getElementById("wadahTabel");
    const kosong = document.getElementById("kosong");
    const elPesan = document.getElementById("pesan");

    const ASPEK = ["nilai_h", "nilai_tl", "nilai_uts", "nilai_uas"];
    const u = getUser() || {};

    function hurufDari(n) {
        // Disalin dari aturan aplikasi lama, termasuk celah di angka 44 yang
        // tidak menghasilkan huruf apa pun. Server tetap yang berwenang.
        if (n >= 80) return "A";
        if (n >= 68 && n <= 79) return "B";
        if (n >= 56 && n <= 67) return "C";
        if (n >= 45 && n <= 55) return "D";
        if (n < 44) return "E";
        return "";
    }

    function baris(r) {
        const tr = el("tr");
        tr.appendChild(sel(r.nim, "kode whitespace-nowrap"));
        tr.appendChild(sel(r.name, "font-medium"));
        const tdNilai = el("td", "text-right whitespace-nowrap");

        function segarkan(nilai) {
            kosongkan(tdNilai);
            if (nilai > 0) {
                tdNilai.appendChild(el("span", "font-data text-sm tabular-nums", nilai));
                tdNilai.appendChild(el("span", "huruf-mutu text-bata ml-1.5", hurufDari(nilai)));
            } else {
                tdNilai.appendChild(el("span", "text-tinta-samar", "—"));
            }
        }

        ASPEK.forEach(function (aspek) {
            const td = el("td", "text-center p-1");
            const inp = document.createElement("input");
            inp.type = "number";
            inp.min = "0"; inp.max = "100"; inp.step = "1";
            inp.className = "kotak-nilai";
            inp.value = r[aspek] || "";
            inp.setAttribute("aria-label",
                aspek.replace("nilai_", "").toUpperCase() + " untuk " + r.name);

            inp.addEventListener("change", function () {
                const nilai = inp.value === "" ? 0 : Number(inp.value);
                if (!Number.isInteger(nilai) || nilai < 0 || nilai > 100) {
                    inp.classList.add("salah");
                    pesan(elPesan, "Nilai harus bilangan bulat 0 sampai 100.", "galat");
                    return;
                }
                inp.classList.remove("salah");
                // Keadaan simpan milik BARIS, bukan kotaknya, sama seperti
                // halaman Penilaian. Kelas `menyimpan`/`tersimpan` pada kotak
                // yang dipakai sebelumnya tidak pernah ada di CSS mana pun:
                // dosen mengisi nilai dan tidak melihat umpan balik apa pun.
                tr.classList.add("baris-menyimpan");
                postJSON(backend.kkn.gradesCourse, { id: r.id, field: aspek, nilai: nilai },
                    function (hasil) {
                        tr.classList.remove("baris-menyimpan");
                        if (!sehat(hasil, elPesan)) {
                            // Ditandai salah supaya penilai tahu angka di layar
                            // TIDAK tersimpan di server.
                            inp.classList.add("salah");
                            tr.classList.add("baris-gagal");
                            return;
                        }
                        tr.classList.remove("baris-gagal");
                        r[aspek] = nilai;
                        const d = (hasil.data || {}).data || {};
                        segarkan(d.nilai != null ? d.nilai : r.nilai);
                        sembunyikan(elPesan);
                        tr.classList.add("baris-tersimpan");
                        setTimeout(function () { tr.classList.remove("baris-tersimpan"); }, 1600);
                    }, ...tokenHeader());
            });
            td.appendChild(inp);
            tr.appendChild(td);
        });

        tr.appendChild(tdNilai);
        segarkan(r.nilai);
        return tr;
    }

    function muatNilai() {
        const id = selMatkul.value;
        if (!id) {
            wadah.hidden = true;
            kosong.hidden = false;
            ringkas.textContent = "";
            return;
        }
        kosong.hidden = true;
        wadah.hidden = false;
        kosongkan(isi);
        const tr = el("tr");
        const td = el("td", "text-center py-10 text-tinta-redup text-sm", "Memuat…");
        td.colSpan = 7; tr.appendChild(td); isi.appendChild(tr);

        getJSON(backend.kkn.gradesCourseList + "?limit=200&course_id=" + encodeURIComponent(id),
            function (hasil) {
                kosongkan(isi);
                if (!sehat(hasil, elPesan)) {
                    const t = el("tr");
                    const d = el("td", "text-center py-10 text-tinta-redup text-sm", "Gagal memuat.");
                    d.colSpan = 7; t.appendChild(d); isi.appendChild(t);
                    return;
                }
                const rows = (hasil.data || {}).data || [];
                if (!rows.length) {
                    const t = el("tr");
                    const d = el("td", "text-center py-10 text-tinta-redup text-sm",
                        "Belum ada mahasiswa terdaftar di mata kuliah ini.");
                    d.colSpan = 7; t.appendChild(d); isi.appendChild(t);
                    ringkas.textContent = "";
                    return;
                }
                rows.forEach(function (r) { isi.appendChild(baris(r)); });
                const dinilai = rows.filter(function (r) { return r.nilai > 0; }).length;
                ringkas.textContent = dinilai + " dari " + rows.length + " sudah dinilai";
            }, ...tokenHeader());
    }

    function muatMatkul() {
        // Dosen hanya ditawari mata kuliah yang diampunya. Backend juga
        // menegakkannya dengan 403; menawarkan pilihan yang pasti ditolak
        // itu menjebak.
        const p = new URLSearchParams({ limit: "200" });
        if (u.role === PERAN.DOSEN) p.set("pengampu", "1");
        getJSON(backend.master.courses + "?" + p.toString(), function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            const daftar = (hasil.data || {}).data || [];
            daftar.forEach(function (m) {
                selMatkul.appendChild(opsi(m.id,
                    m.matkul + (m.semester ? " · semester " + m.semester : "")));
            });
            if (!daftar.length) {
                selMatkul.appendChild(opsi("", "Tidak ada mata kuliah yang Anda ampu", true));
            }
        }, ...tokenHeader());
    }

    selMatkul.addEventListener("change", muatNilai);
    muatMatkul();
    muatNilai();
}
</script>
</body>
</html>
