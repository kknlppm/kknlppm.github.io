<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <title>Register KKN — LPPM Universitas Al-Ghifari</title>
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<!-- Halaman "Register" sudah tidak ada sejak 8 September 2026: tabel yang
     dulu di sini ditumpangi tiga pekerjaan untuk enam peran. Kini tiap peran
     punya halamannya — Pendaftaran, Pembayaran, KKN saya — dan buku besarnya
     ada di Data induk › Peserta. Alamat ini dipertahankan supaya tautan lama
     dan bookmark tidak mati; ia hanya mengalihkan menurut peran. -->
<main class="max-w-xl mx-auto px-5 py-16 text-center text-sm text-tinta-redup">
  <p>Halaman ini pindah. Mengalihkan…</p>
</main>
<script type="module">
import { redirect } from "/assets/js/jscroot/url.js";
import { requireLogin, getUser } from "/assets/js/auth.js";
import { PERAN } from "/assets/js/config.js";

if (requireLogin()) {
    const u = getUser() || {};
    const tujuan = {
        [PERAN.PEMBAYARAN]: "/pembayaran/",
        [PERAN.MAHASISWA]: "/saya/",
        [PERAN.DOSEN]: "/penilaian/",
        [PERAN.VALIDASI_LPPM]: "/sertifikat/",
        [PERAN.ADMIN_BERITA]: "/kelola-berita/",
    };
    redirect(tujuan[u.role] || "/data-induk/?entitas=peserta");
}
</script>
</body>
</html>
