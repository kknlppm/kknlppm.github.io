<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Register KKN — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1400px] mx-auto px-5 py-5">

  <!-- Papan perintah. Tahun ajarannya cuma lima, jadi kelimanya ditampilkan
       — menyembunyikannya di dropdown menyamarkan sesuatu yang kecil. -->
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div id="segmenTahun" class="segmen" role="group" aria-label="Tahun ajaran"></div>
    <div id="segmenBayar" class="segmen" role="group" aria-label="Status pembayaran" hidden></div>

    <div class="flex-1 min-w-[14rem]">
      <label for="cari" class="sr-only">Cari peserta</label>
      <input id="cari" type="search" class="medan" spellcheck="false"
             placeholder="NIM, nama, atau judul KKN">
    </div>

    <output id="ringkasan" class="font-data text-xs text-tinta-redup whitespace-nowrap basis-full sm:basis-auto"></output>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-15rem)]">
      <!-- `table-fixed`: tanpa itu lebar kolom ditentukan isi terpanjangnya,
           dan "Judul KKN" — yang 98% baris kosong — mengambil 352px lalu
           mendorong Nilai dan Sertifikat keluar layar di 1440px. Dengan lebar
           dipatok, tabelnya muat dan judulnya tetap terlihat saat ada isinya. -->
      <table class="register table-fixed min-w-[52rem] lg:min-w-[60rem] 2xl:min-w-[70rem]">
        <thead>
          <tr>
            <th class="w-[6.5rem]">NIM</th>
            <th>Nama</th>
            <th class="hidden lg:table-cell w-[8.5rem]">Program studi</th>
            <th class="w-[5rem]">Kelompok</th>
            <th class="hidden md:table-cell w-[6rem]">TA</th>
            <th class="hidden 2xl:table-cell w-[9rem]">Judul KKN</th>
            <th class="hidden sm:table-cell w-[6.5rem]">Bayar</th>
            <th class="w-[6.5rem]"><span class="text-tinta-redup">H·S·L·QP·QL</span></th>
            <th class="text-right w-[4.5rem]">Nilai</th>
            <th class="w-[6rem]">Sertifikat</th>
          </tr>
        </thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <nav class="flex items-center justify-between gap-3 mt-4" aria-label="Halaman">
    <button id="sebelumnya" class="tombol-halus" disabled aria-label="Sebelumnya"><span aria-hidden="true">←</span><span class="hidden sm:inline">Sebelumnya</span></button>
    <span id="posisiHalaman" class="font-data text-xs text-tinta-redup whitespace-nowrap"></span>
    <button id="berikutnya" class="tombol-halus" disabled aria-label="Berikutnya"><span class="hidden sm:inline">Berikutnya</span><span aria-hidden="true">→</span></button>
  </nav>
</main>

<!-- Laci pembayaran. Hanya digambar untuk peran yang berhak; backend juga
     menegakkannya (SaveParticipation membatasi peran pembayaran hanya boleh
     menyentuh status_bayar). -->
<div id="tirai" class="tirai" hidden></div>
<aside id="laci" class="laci" hidden aria-labelledby="judulLaci" role="dialog" aria-modal="true">
  <form id="formBayar" class="flex flex-col h-full" novalidate>
    <div class="px-5 py-4 border-b border-garis">
      <h2 id="judulLaci" class="judul-halaman text-lg">Status pembayaran</h2>
      <p id="siapa" class="text-sm text-tinta-redup mt-0.5"></p>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4 space-y-4">
      <div id="pesanLaci" hidden role="alert"></div>
      <div>
        <label for="fBayar" class="block text-sm font-medium mb-1.5">Status</label>
        <select id="fBayar" name="status_bayar" class="medan"></select>
      </div>
      <div>
        <label for="fKet" class="block text-sm font-medium mb-1.5">Catatan</label>
        <textarea id="fKet" name="ket" class="medan" rows="3"
                  placeholder="Wajib diisi kalau pembayarannya sebagian."></textarea>
      </div>
    </div>
    <div class="px-5 py-4 border-t border-garis flex gap-2 justify-end">
      <button type="button" id="tombolBatal" class="tombol-halus">Batal</button>
      <button type="submit" id="tombolSimpan" class="tombol-utama">Simpan</button>
    </div>
  </form>
</aside>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { getQueryString } from "/assets/js/jscroot/url.js";
import { backend, BAYAR, PERAN } from "/assets/js/config.js";
import { requireLogin, tokenHeader, getUser } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { buat as buatLaci } from "/assets/js/laci.js";
import { el, sel, opsi, tanda, deretNilai, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Register KKN");

    const isi = document.getElementById("isiTabel");
    const elPesan = document.getElementById("pesan");
    const ringkasan = document.getElementById("ringkasan");
    const posisi = document.getElementById("posisiHalaman");
    const segmen = document.getElementById("segmenTahun");
    const inpCari = document.getElementById("cari");
    const btnPrev = document.getElementById("sebelumnya");
    const btnNext = document.getElementById("berikutnya");
    const KOLOM = 10;

    let halaman = 1, totalHalaman = 1, tahun = "";

    // Peran yang boleh menyentuh pembayaran. Ini KENYAMANAN — backend
    // menegakkannya di SaveParticipation, dan peran pembayaran di sana hanya
    // boleh mengubah status_bayar, bukan yang lain.
    const u = getUser() || {};
    const bolehBayar = u.role === PERAN.ADMIN || u.role === PERAN.PEMBAYARAN;

    // ?bayar=0|1|2 menyaring status pembayaran. Petugas pembayaran mendarat
    // langsung di ?bayar=0 — pekerjaannya persis daftar yang belum bayar.
    let bayar = (function () {
        // getQueryString() jscroot TIDAK menerima argumen: ia mengembalikan
        // Proxy yang diindeks, jadi `getQueryString("bayar")` mengembalikan
        // Proxy-nya sendiri — truthy, dan diam-diam salah. Dua pemakaian lain
        // di repo ini (verifikasi, berita) sudah memakai bentuk yang benar.
        const v = getQueryString().bayar;
        return v === "0" || v === "1" || v === "2" ? v : "";
    })();

    const laci = bolehBayar ? buatLaci("laci", "tirai", "tombolBatal") : null;
    let sedang = null;

    function barisPesan(teks) {
        const tr = el("tr");
        const td = el("td", "text-center py-10 text-tinta-redup text-sm", teks);
        td.colSpan = KOLOM;
        tr.appendChild(td);
        return tr;
    }

    function gambarBaris(r) {
        const tr = el("tr");
        // Disimpan supaya satu baris bisa digambar ulang sendiri tanpa
        // memuat ulang seluruh daftar.
        r.__tr = tr;
        tr.appendChild(sel(r.nim, "kode whitespace-nowrap"));

        // Nama TIDAK dibungkus: satu nama tiga baris menaikkan tinggi seluruh
        // barisnya, dan dulu itu memangkas isi layar dari ~20 baris jadi 11.
        // Yang terpotong tetap terbaca lewat `title`, dan kotak cari ada di
        // atas untuk yang mencari orang tertentu.
        const tdNama = el("td", "font-medium");
        tdNama.title = r.name || "";
        const bungkusNama = el("div", "flex items-center gap-1.5 min-w-0");
        bungkusNama.appendChild(el("span", "truncate", r.name || "—"));
        if (r.ketua) {
            bungkusNama.appendChild(el("span", "tanda is-belum shrink-0", "ketua"));
        }
        tdNama.appendChild(bungkusNama);
        tr.appendChild(tdNama);

        const tdProdi = sel(r.prodi, "text-xs text-tinta-redup hidden lg:table-cell truncate");
        tdProdi.title = r.prodi || "";
        tr.appendChild(tdProdi);
        // Sebagian data menuliskan "Kelompok 22", sebagian hanya "33".
        // Kolomnya sudah berjudul Kelompok; awalannya dibuang supaya
        // katanya tidak terbaca dua kali.
        tr.appendChild(sel(String(r.kelompok || "").replace(/^kelompok\s+/i, ""), "kode"));
        tr.appendChild(sel(r.tahun_ajaran, "kode whitespace-nowrap hidden md:table-cell"));

        const tdJudul = sel(r.judul_kkn, "text-xs text-tinta-redup hidden 2xl:table-cell truncate");
        tdJudul.title = r.judul_kkn || "";
        tr.appendChild(tdJudul);

        tr.appendChild(selBayar(r));
        tr.appendChild(deretNilai(r));

        const tdNilai = el("td", "text-right whitespace-nowrap");
        if (r.nilai > 0) {
            tdNilai.appendChild(el("span", "font-data text-sm tabular-nums", r.nilai));
            tdNilai.appendChild(el("span", "huruf-mutu text-bata ml-1.5", r.huruf || ""));
        } else {
            tdNilai.appendChild(el("span", "text-tinta-samar", "—"));
        }
        tr.appendChild(tdNilai);

        tr.appendChild(r.has_cert ? tanda("terbit", "sah") : tanda("belum", "kosong"));
        return tr;
    }

    // Status bayar digambar sebagai penanda; kalau perannya berhak, penanda
    // itu sekaligus tombol. Datanya SUDAH dikirim backend di tiap baris sejak
    // awal — sampai 5 September 2026 ia hanya tidak pernah ditampilkan.
    function selBayar(r) {
        const b = BAYAR.find(function (x) { return x.nilai === (r.status_bayar || 0); }) || BAYAR[0];
        const td = el("td", "hidden sm:table-cell whitespace-nowrap");
        if (!bolehBayar) {
            td.appendChild(el("span", "tanda is-" + b.tanda, b.teks));
            if (r.ket) td.title = r.ket;
            return td;
        }
        const tombol = el("button", "tanda is-" + b.tanda + " hover:ring-1 hover:ring-bata", b.teks);
        tombol.type = "button";
        tombol.title = r.ket ? r.ket + " — klik untuk mengubah" : "Klik untuk mengubah";
        tombol.addEventListener("click", function () { bukaBayar(r); });
        td.appendChild(tombol);
        return td;
    }

    function bukaBayar(r) {
        sedang = r;
        document.getElementById("siapa").textContent = r.nim + " · " + r.name;
        const selBayarEl = document.getElementById("fBayar");
        kosongkan(selBayarEl);
        BAYAR.forEach(function (b) { selBayarEl.appendChild(opsi(b.nilai, b.teks)); });
        selBayarEl.value = String(r.status_bayar || 0);
        document.getElementById("fKet").value = r.ket || "";
        sembunyikan(document.getElementById("pesanLaci"));
        laci.buka();
    }

    function muat() {
        sembunyikan(elPesan);
        kosongkan(isi);
        isi.appendChild(barisPesan("Memuat…"));

        const p = new URLSearchParams({ page: String(halaman), limit: "50" });
        if (tahun) p.set("tahun_ajaran", tahun);
        if (bayar) p.set("bayar", bayar);
        if (inpCari.value.trim()) p.set("q", inpCari.value.trim());

        getJSON(backend.kkn.participations + "?" + p.toString(), jawabanMuat, ...tokenHeader());
    }

    function jawabanMuat(hasil) {
        if (!sehat(hasil, elPesan)) {
            kosongkan(isi);
            isi.appendChild(barisPesan("Gagal memuat."));
            return;
        }
        const amplop = hasil.data || {};

        kosongkan(isi);
        const baris = amplop.data || [];
        if (!baris.length) {
            isi.appendChild(barisPesan("Tidak ada peserta yang cocok."));
        } else {
            baris.forEach(function (r) { isi.appendChild(gambarBaris(r)); });
        }

        const m = amplop.meta || {};
        totalHalaman = m.total_pages || 1;
        ringkasan.textContent = (m.total || 0).toLocaleString("id-ID") + " peserta";
        posisi.textContent = "Halaman " + (m.page || 1) + " dari " + totalHalaman;
        btnPrev.disabled = (m.page || 1) <= 1;
        btnNext.disabled = (m.page || 1) >= totalHalaman;
    }

    function tombolTahun(nilai, label) {
        const b = el("button", "", label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(tahun === nilai));
        b.addEventListener("click", function () {
            tahun = nilai;
            halaman = 1;
            segmen.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.nilai === nilai));
            });
            muat();
        });
        b.dataset.nilai = nilai;
        return b;
    }

    function muatTahun() {
        segmen.appendChild(tombolTahun("", "Semua"));
        getJSON(backend.master.academicYears, function (hasil) {
            // Saringan opsional: kalau gagal, register tetap terbuka tanpa
            // tombol tahun. Sengaja TIDAK lewat sehat() — 401 di sini sudah
            // ditangani panggilan utama, dan dua pengalihan bersamaan
            // membuat halaman berkedip.
            if (!hasil || hasil.status !== 200) return;
            const amplop = hasil.data || {};
            (amplop.data || []).forEach(function (ta) {
                segmen.appendChild(tombolTahun(ta, ta));
            });
        }, ...tokenHeader());
    }

    btnPrev.addEventListener("click", function () { if (halaman > 1) { halaman--; muat(); } });
    btnNext.addEventListener("click", function () { if (halaman < totalHalaman) { halaman++; muat(); } });

    let jeda;
    inpCari.addEventListener("input", function () {
        clearTimeout(jeda);
        jeda = setTimeout(function () { halaman = 1; muat(); }, 350);
    });

    // ── segmen pembayaran ──
    // Digambar hanya untuk peran yang mengurusnya. Untuk yang lain, kolom
    // Bayar tetap terlihat tapi tidak bisa disaring — menawarkan penyaring
    // yang tidak dipakai siapa pun hanya menambah yang harus dibaca.
    function pasangSegmenBayar() {
        if (!bolehBayar) return;
        const seg = document.getElementById("segmenBayar");
        seg.hidden = false;
        const pilihan = [{ nilai: "", teks: "Semua bayar" }].concat(
            BAYAR.map(function (b) { return { nilai: String(b.nilai), teks: b.teks }; }));
        pilihan.forEach(function (o) {
            const b = el("button", "", o.teks);
            b.type = "button";
            b.dataset.nilai = o.nilai;
            b.setAttribute("aria-pressed", String(bayar === o.nilai));
            b.addEventListener("click", function () {
                bayar = o.nilai;
                halaman = 1;
                seg.querySelectorAll("button").forEach(function (x) {
                    x.setAttribute("aria-pressed", String(x.dataset.nilai === bayar));
                });
                muat();
            });
            seg.appendChild(b);
        });
    }

    if (bolehBayar) {
        document.getElementById("formBayar").addEventListener("submit", function (ev) {
            ev.preventDefault();
            if (!sedang) return;
            const elPesanLaci = document.getElementById("pesanLaci");
            const status = Number(document.getElementById("fBayar").value);
            const ket = document.getElementById("fKet").value.trim();
            // Pembayaran sebagian tanpa catatan tidak bisa ditelusuri nanti:
            // tidak ada yang tahu berapa yang sudah masuk.
            if (status === 1 && !ket) {
                pesan(elPesanLaci, "Pembayaran sebagian wajib disertai catatan.", "galat");
                return;
            }
            const tombol = document.getElementById("tombolSimpan");
            tombol.disabled = true;
            postJSON(backend.kkn.participation(encodeURIComponent(sedang.id)),
                { status_bayar: status, ketua: !!sedang.ketua, ket: ket },
                function (hasil) {
                    tombol.disabled = false;
                    if (!sehat(hasil, elPesanLaci)) return;
                    sedang.status_bayar = status;
                    sedang.ket = ket;
                    laci.tutup();

                    // Diperbarui DI TEMPAT, bukan dengan memuat ulang daftar:
                    // memuat ulang membuang posisi gulung, dan petugas yang
                    // mengerjakan sepuluh orang berturut-turut harus mencari
                    // tempatnya lagi sepuluh kali.
                    const tr = sedang.__tr;
                    if (!tr || !tr.parentNode) return;
                    if (bayar !== "" && bayar !== String(status)) {
                        // Barisnya tidak lagi cocok dengan saringan yang aktif
                        // — ia memang harus pergi, dan hitungannya ikut turun.
                        tr.remove();
                        const sisa = isi.querySelectorAll("tr").length;
                        if (!sisa) { kosongkan(isi); isi.appendChild(barisPesan("Tidak ada peserta yang cocok.")); }
                        pesan(elPesan, sedang.name + " ditandai " +
                            (BAYAR.find(function (x) { return x.nilai === status; }) || BAYAR[0]).teks.toLowerCase() +
                            " dan keluar dari saringan ini.", "sah");
                        return;
                    }
                    tr.replaceWith(gambarBaris(sedang));
                }, ...tokenHeader());
        });
    }

    pasangSegmenBayar();
    muatTahun();
    muat();
}
</script>
</body>
</html>
