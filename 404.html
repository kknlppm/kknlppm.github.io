<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Halaman tidak ditemukan — KKN LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema dipasang SEBELUM stylesheet supaya halaman gelap tidak berkedip putih. -->
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="pita-atas" aria-hidden="true"></div>
  <main class="min-h-screen grid place-items-center p-5">
    <div class="text-center max-w-sm">
      <div class="eyebrow">404</div>
      <h1 class="judul-halaman text-2xl mt-1">Halaman tidak ditemukan</h1>
      <p class="text-sm text-tinta-redup mt-2">
        Kalau Anda datang dari QR pada sertifikat, kode itu belum terpindai utuh.
      </p>
      <div class="flex gap-2 justify-center mt-6">
        <a href="/verifikasi/" class="tombol-halus">Verifikasi sertifikat</a>
        <a href="/" class="tombol-utama">Beranda</a>
      </div>
    </div>
  </main>
  <script>
  (function () {
      // GitHub Pages menyajikan berkas statis, jadi /verifikasi/<token> tidak
      // punya berkas sendiri dan jatuh ke sini. QR pada 140+ sertifikat yang
      // sudah tercetak menunjuk bentuk jalur itu dan TIDAK BISA diubah —
      // jadi jalurnya yang harus tetap bekerja.
      var m = window.location.pathname.match(/\/verifikasi\/([a-fA-F0-9]{32})\/?$/);
      if (m) {
          window.location.replace("/verifikasi/?token=" + m[1]);
          return;
      }

      // Alamat berita yang dibagikan orang: /berita/<slug>. Ditambahkan
      // SESUDAH aturan verifikasi dan dengan `return` di atas, supaya jalur
      // QR tidak pernah tersentuh apa pun yang ditambahkan di bawahnya.
      var b = window.location.pathname.match(/\/berita\/([a-z0-9][a-z0-9-]{0,120})\/?$/);
      if (b) {
          window.location.replace("/berita/?slug=" + encodeURIComponent(b[1]));
      }
  })();
  </script>
</body>
</html>
