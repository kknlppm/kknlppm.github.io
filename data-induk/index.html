<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Data induk — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema dipasang SEBELUM stylesheet supaya halaman gelap tidak berkedip putih. -->
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-[1200px] mx-auto px-5 py-5">

  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div id="segmenEntitas" class="segmen" role="group" aria-label="Jenis data"></div>
    <div id="segmenSaring" class="segmen" role="group" aria-label="Saringan" hidden></div>
    <div class="flex-1 min-w-[12rem]">
      <label for="cari" class="sr-only">Cari</label>
      <input id="cari" type="search" class="medan" spellcheck="false" placeholder="Cari…">
    </div>
    <output id="ringkasan" class="font-data text-xs text-tinta-redup whitespace-nowrap basis-full sm:basis-auto"></output>
    <button id="tombolTambah" class="tombol-utama">Tambah</button>
  </div>

  <div id="pesan" hidden role="alert"></div>

  <div class="bg-kertas rounded-2xl shadow-kartu overflow-hidden">
    <div class="overflow-auto max-h-[calc(100vh-15rem)]">
      <table class="register">
        <thead><tr id="kepalaTabel"></tr></thead>
        <tbody id="isiTabel"></tbody>
      </table>
    </div>
  </div>

  <nav id="kakiHalaman" class="flex items-center justify-between gap-3 mt-4" aria-label="Halaman" hidden>
    <button id="sebelumnya" type="button" class="tombol-halus" disabled aria-label="Sebelumnya"><span aria-hidden="true">←</span><span class="hidden sm:inline">Sebelumnya</span></button>
    <span id="posisiHalaman" class="font-data text-xs text-tinta-redup whitespace-nowrap"></span>
    <button id="berikutnya" type="button" class="tombol-halus" disabled aria-label="Berikutnya"><span class="hidden sm:inline">Berikutnya</span><span aria-hidden="true">→</span></button>
  </nav>
</main>

<div id="tirai" class="tirai" hidden></div>
<aside id="laci" class="laci" hidden aria-labelledby="judulLaci" role="dialog" aria-modal="true">
  <form id="formInduk" class="flex flex-col h-full" novalidate>
    <div class="px-5 py-4 border-b border-garis">
      <h2 id="judulLaci" class="judul-halaman text-lg">Tambah</h2>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4 space-y-4">
      <div id="pesanLaci" hidden role="alert"></div>
      <div id="medanForm" class="space-y-4"></div>
    </div>
    <div class="px-5 py-4 border-t border-garis flex gap-2 justify-end">
      <button type="button" id="tombolBatal" class="tombol-halus">Batal</button>
      <button type="submit" id="tombolSimpan" class="tombol-utama">Simpan</button>
    </div>
  </form>
</aside>

<script type="module">
import { getJSON, postJSON, deleteJSON } from "/assets/js/jscroot/api.js";
import { backend, PERAN } from "/assets/js/config.js";
import { requireLogin, tokenHeader, getUser } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { buat as buatLaci } from "/assets/js/laci.js";
import { el, sel, opsi, pesan, sembunyikan, kosongkan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Data induk");

    const u = getUser() || {};

    // Keempat jenis data digambarkan sebagai data, bukan sebagai empat
    // salinan kode. Yang berbeda hanya kolom dan medan formulirnya.
    const ENTITAS = {
        // Mahasiswa ditaruh paling depan: 1.706 baris, jauh lebih sering
        // dicari daripada sembilan prodi. Sampai 5 September 2026 entitas ini
        // TIDAK ADA sama sekali — koleksinya hanya bisa diisi migrasi.
        students: {
            label: "Mahasiswa", tunggal: "mahasiswa", jalur: backend.master.students,
            kolom: [
                { judul: "NIM", ambil: function (r) { return r.nim; }, kelas: "kode whitespace-nowrap" },
                { judul: "Nama", ambil: function (r) { return r.name; }, kelas: "font-medium" },
                { judul: "Kelas", ambil: function (r) { return r.kelas || "—"; }, kelas: "kode" },
                { judul: "Email", ambil: function (r) { return r.email || "—"; }, kelas: "text-xs text-tinta-redup" },
                { judul: "Akun", ambil: function (r) { return r.uname ? r.uname + (r.akun_aktif === false ? " (nonaktif)" : "") : "belum ada"; }, kelas: "kode" },
            ],
            medan: [
                { nama: "nim", label: "NIM", wajib: true, mono: true,
                  petunjuk: "6 sampai 20 huruf atau angka, tanpa spasi — contoh A1A230001 atau 234060001. Huruf kecil disimpan sebagai huruf besar." },
                { nama: "name", label: "Nama lengkap", wajib: true },
                { nama: "program_id", label: "Program studi", tipe: "pilih",
                  sumber: backend.master.programs + "?limit=200", nilai: "id", teks: "prodi" },
                { nama: "kelas", label: "Kelas" },
                { nama: "email", label: "Email", tipe: "email" },
                { nama: "phone", label: "Telepon" },
                { nama: "domisili", label: "Domisili" },
                // Akun lahir bersama datanya. Nama penggunanya selalu NIM
                // (mahasiswa masuk memakai NIM); yang diatur di sini hanya
                // sandinya.
                { nama: "password", label: "Sandi akun", tipe: "password",
                  petunjuk: "Nama pengguna akun mahasiswa adalah NIM-nya. Isi sandi untuk membuat akun atau menggantinya; kosongkan kalau tidak diubah. Peserta yang didaftarkan lewat Register otomatis mendapat akun dengan sandi awal NIM." },
            ],
            keluar: function (f) {
                return { nim: f.nim, name: f.name, program_id: f.program_id,
                         kelas: f.kelas, email: f.email, phone: f.phone, domisili: f.domisili,
                         password: f.password || "" };
            },
        },
        programs: {
            label: "Program studi", tunggal: "program studi", jalur: backend.master.programs,
            kolom: [
                { judul: "Program studi", ambil: function (r) { return r.prodi; }, kelas: "font-medium" },
                { judul: "Fakultas", ambil: function (r) { return r.fakultas_id || "—"; }, kelas: "kode" },
            ],
            medan: [
                { nama: "prodi", label: "Nama program studi", wajib: true },
                { nama: "fakultas_id", label: "Kode fakultas", tipe: "number" },
            ],
            keluar: function (f) { return { prodi: f.prodi, fakultas_id: Number(f.fakultas_id) || 0 }; },
        },
        lecturers: {
            label: "Dosen", tunggal: "dosen", jalur: backend.master.lecturers,
            kolom: [
                { judul: "Nama", ambil: function (r) { return r.name; }, kelas: "font-medium" },
                { judul: "NIDN", ambil: function (r) { return r.nidn; }, kelas: "kode" },
                { judul: "Email", ambil: function (r) { return r.email; }, kelas: "text-xs text-tinta-redup" },
                { judul: "Akun", ambil: function (r) { return r.uname ? r.uname + (r.akun_aktif === false ? " (nonaktif)" : "") : "belum ada"; }, kelas: "kode" },
                { judul: "Peran", ambil: function (r) {
                    const p = [];
                    if (r.status_dpl) p.push("DPL");
                    if (r.status_dpmk) p.push("Pengampu");
                    return p.join(" · ") || "—";
                }, kelas: "kode" },
            ],
            medan: [
                { nama: "name", label: "Nama lengkap", wajib: true },
                { nama: "nidn", label: "NIDN", mono: true },
                { nama: "email", label: "Email", tipe: "email" },
                { nama: "status_dpl", label: "Pembimbing lapangan KKN (DPL)", tipe: "centang" },
                { nama: "status_dpmk", label: "Pengampu mata kuliah", tipe: "centang" },
                // Akun dosen: nama pengguna pilihan admin, sandi awal diketik
                // admin. Diisi di sini, bukan di Pengguna — akun lahir bersama
                // datanya.
                { nama: "uname", label: "Nama pengguna akun", mono: true,
                  petunjuk: "Kosong berarti belum punya akun. Isi bersama sandi untuk membuatnya." },
                { nama: "password", label: "Sandi akun", tipe: "password",
                  petunjuk: "Minimal 8 karakter. Kosongkan kalau tidak diganti." },
            ],
            keluar: function (f) {
                return { name: f.name, nidn: f.nidn, email: f.email,
                         status_dpl: !!f.status_dpl, status_dpmk: !!f.status_dpmk,
                         uname: f.uname || "", password: f.password || "" };
            },
        },
        courses: {
            label: "Mata kuliah", tunggal: "mata kuliah", jalur: backend.master.courses,
            kolom: [
                { judul: "Mata kuliah", ambil: function (r) { return r.matkul; }, kelas: "font-medium" },
                { judul: "Semester", ambil: function (r) { return r.semester || "—"; }, kelas: "kode" },
                { judul: "SKS", ambil: function (r) { return r.sks; }, kelas: "kode" },
            ],
            medan: [
                { nama: "matkul", label: "Nama mata kuliah", wajib: true },
                { nama: "semester", label: "Semester", tipe: "number", petunjuk: "0 sampai 14" },
                { nama: "sks", label: "SKS" },
                { nama: "program_id", label: "Program studi", tipe: "pilih",
                  sumber: backend.master.programs + "?limit=200", nilai: "id", teks: "prodi" },
            ],
            keluar: function (f) {
                return { matkul: f.matkul, semester: Number(f.semester) || 0,
                         sks: f.sks, nidn: "", program_id: f.program_id };
            },
        },
        users: {
            label: "Pengguna", tunggal: "pengguna", jalur: backend.master.users,
            hanyaAdmin: true,
            // Daftar bawaannya staf saja: 1.706 akun mahasiswa akan menenggelamkan
            // sebelas akun yang biasanya dikelola. Dosen dan mahasiswa lewat
            // saringan, dengan parameter role yang dibaca server.
            saring: [
                { label: "Staf", param: "" }, { label: "Dosen", param: "4" }, { label: "Mahasiswa", param: "3" },
            ],
            kolom: [
                { judul: "Nama pengguna", ambil: function (r) { return r.uname; }, kelas: "kode" },
                { judul: "Nama", ambil: function (r) { return r.name; }, kelas: "font-medium" },
                { judul: "Peran", ambil: function (r) { return r.role_name || r.role; }, kelas: "kode" },
                { judul: "Status", ambil: function (r) { return r.active ? "Aktif" : "Nonaktif"; }, kelas: "kode" },
            ],
            medan: [
                { nama: "role", label: "Peran", tipe: "pilih", pilihan: [
                    { nilai: 1, teks: "Admin" }, { nilai: 2, teks: "Pembayaran" },
                    { nilai: 3, teks: "Mahasiswa" }, { nilai: 4, teks: "Dosen" },
                    { nilai: 5, teks: "Validasi LPPM" }, { nilai: 6, teks: "Admin fakultas" },
                    { nilai: 7, teks: "Admin berita" },
                ], petunjuk: "Admin berita hanya bisa mengelola berita. Akun mahasiswa dan dosen harus menunjuk data yang sudah ada." },
                // Tautan ke data domain: tampil hanya untuk peran yang butuh.
                // Tanpa tautan, akun mahasiswa/dosen bisa masuk tapi tidak
                // melihat apa pun — server menolaknya.
                { nama: "nim", label: "NIM mahasiswa", mono: true, jika: { medan: "role", nilai: ["3"] },
                  petunjuk: "Datanya harus sudah ada di Mahasiswa. Nama pengguna dan nama lengkap boleh dikosongkan: mahasiswa masuk memakai NIM-nya." },
                { nama: "ref_id", label: "Dosen", tipe: "pilih", jika: { medan: "role", nilai: ["4"] },
                  sumber: backend.master.lecturers + "?limit=200", nilai: "id", teks: "name",
                  petunjuk: "Datanya harus sudah ada di Dosen. Nama lengkap boleh dikosongkan." },
                { nama: "uname", label: "Nama pengguna", mono: true },
                { nama: "name", label: "Nama lengkap" },
                { nama: "password", label: "Sandi", tipe: "password",
                  petunjuk: "Minimal 8 karakter. Kosongkan saat mengubah kalau sandinya tidak diganti." },
                { nama: "active", label: "Akun aktif", tipe: "centang", bawaan: true },
            ],
            keluar: function (f) {
                return { uname: f.uname, name: f.name, role: Number(f.role),
                         active: !!f.active, password: f.password || "",
                         nim: f.nim || "", ref_id: f.ref_id || "" };
            },
        },
    };

    const urutan = Object.keys(ENTITAS).filter(function (k) {
        return !ENTITAS[k].hanyaAdmin || u.role === PERAN.ADMIN;
    });
    let kini = urutan[0], sunting = null, halaman = 1;

    const isi = document.getElementById("isiTabel");
    const kepala = document.getElementById("kepalaTabel");
    const elPesan = document.getElementById("pesan");
    const ringkasan = document.getElementById("ringkasan");
    const segmen = document.getElementById("segmenEntitas");
    const segmenSaring = document.getElementById("segmenSaring");
    let saringAktif = "";   // nilai param role untuk entitas yang punya saringan
    const inpCari = document.getElementById("cari");
    const kakiHal = document.getElementById("kakiHalaman");
    const posisi = document.getElementById("posisiHalaman");
    const btnPrev = document.getElementById("sebelumnya");
    const btnNext = document.getElementById("berikutnya");

    // Server memplafon `limit` di 200, jadi meminta lebih tidak menambah apa
    // pun. Dulu halaman ini meminta 200 tanpa kontrol halaman: ringkasannya
    // menulis "1706 mahasiswa" sementara tabelnya berhenti di baris ke-200,
    // dan 1.506 sisanya tidak bisa dijangkau kecuali kebetulan tertebak lewat
    // kotak cari.
    const SEHALAMAN = 200;

    let totalHalaman = 1;

    function gambarKaki(meta) {
        totalHalaman = meta.total_pages || 1;
        // Disembunyikan kalau muat satu halaman. Prodi cuma sembilan baris;
        // "Halaman 1 dari 1" di bawahnya hanya kebisingan.
        if (totalHalaman <= 1) { kakiHal.hidden = true; return; }
        kakiHal.hidden = false;
        posisi.textContent = "Halaman " + (meta.page || 1) + " dari " + totalHalaman;
        btnPrev.disabled = (meta.page || 1) <= 1;
        btnNext.disabled = (meta.page || 1) >= totalHalaman;
    }

    btnPrev.addEventListener("click", function () { if (halaman > 1) { halaman--; muat(); } });
    btnNext.addEventListener("click", function () { if (halaman < totalHalaman) { halaman++; muat(); } });
    const medanForm = document.getElementById("medanForm");
    const form = document.getElementById("formInduk");
    const laci = buatLaci("laci", "tirai", "tombolBatal");

    function ent() { return ENTITAS[kini]; }

    function gambarKepala() {
        kosongkan(kepala);
        ent().kolom.forEach(function (k) { kepala.appendChild(el("th", "", k.judul)); });
        kepala.appendChild(el("th", "text-right", "Tindakan"));
    }

    function baris(r) {
        const tr = el("tr");
        ent().kolom.forEach(function (k) { tr.appendChild(sel(k.ambil(r), k.kelas)); });
        const td = el("td", "text-right whitespace-nowrap");
        const ubah = el("button", "tautan-aksi", "Ubah");
        ubah.type = "button";
        ubah.addEventListener("click", function () { bukaForm(r); });
        const hapus = el("button", "tautan-aksi tautan-aksi--bahaya ml-3", "Hapus");
        hapus.type = "button";
        hapus.addEventListener("click", function () { hapusBaris(r); });
        td.appendChild(ubah);
        td.appendChild(hapus);
        tr.appendChild(td);
        return tr;
    }

    function muat() {
        sembunyikan(elPesan);
        gambarKepala();
        kosongkan(isi);
        const p = new URLSearchParams({ limit: String(SEHALAMAN), page: String(halaman) });
        if (inpCari.value.trim()) p.set("q", inpCari.value.trim());
        if (ent().saring && saringAktif) p.set("role", saringAktif);
        const jenis = kini;   // dikunci: pengguna bisa berpindah tab sebelum jawabannya tiba
        getJSON(ent().jalur + "?" + p.toString(), function (hasil) {
            if (jenis !== kini) return;
            if (!sehat(hasil, elPesan)) return;
            const amplop = hasil.data || {};
            const rows = amplop.data || [];
            if (!rows.length) {
                const tr = el("tr");
                const td = el("td", "text-center py-10 text-tinta-redup text-sm",
                    "Belum ada " + ent().tunggal + " yang cocok.");
                td.colSpan = ent().kolom.length + 1;
                tr.appendChild(td);
                isi.appendChild(tr);
            } else {
                rows.forEach(function (r) { isi.appendChild(baris(r)); });
            }
            const meta = amplop.meta || {};
            ringkasan.textContent = (meta.total || 0).toLocaleString("id-ID") + " " + ent().tunggal;
            gambarKaki(meta);
        }, ...tokenHeader());
    }

    // gambarMedan menggambar formulirnya seketika, lalu mengisi pilihan yang
    // harus diambil dari server saat jawabannya tiba. Dulu ini `await` di
    // tengah gelung; jscroot bergaya callback, jadi urutannya dibalik —
    // laci tidak lagi menunggu jaringan sebelum terbuka.
    function gambarMedan(data) {
        kosongkan(medanForm);
        ent().medan.forEach(function (m) {
            const bungkus = el("div");
            if (m.tipe === "centang") {
                const l = el("label", "flex items-center gap-2 text-sm");
                const c = document.createElement("input");
                c.type = "checkbox";
                c.name = m.nama;
                c.className = "w-4 h-4 accent-bata";
                c.checked = data ? !!data[m.nama] : !!m.bawaan;
                l.appendChild(c);
                l.appendChild(document.createTextNode(m.label));
                bungkus.appendChild(l);
            } else if (m.tipe === "pilih") {
                bungkus.appendChild(Object.assign(el("label", "block text-sm font-medium mb-1.5", m.label),
                    { htmlFor: "f_" + m.nama }));
                const s = document.createElement("select");
                s.id = "f_" + m.nama;
                s.name = m.nama;
                s.className = "medan";
                s.appendChild(opsi("", "—"));

                // Parameternya BUKAN `opsi`: nama itu sudah dipakai helper
                // yang diimpor di atas, dan menutupinya membuat
                // `opsi(o.nilai, o.teks)` memanggil larik ini — TypeError.
                // Untuk medan berpilihan tetap (peran Pengguna) lemparannya
                // terjadi serentak, jadi laci.buka() tidak pernah dijalankan
                // dan tombol Ubah tampak tidak berbuat apa-apa.
                function isiOpsi(daftar) {
                    (daftar || []).forEach(function (o) {
                        s.appendChild(opsi(o.nilai, o.teks));
                    });
                    if (data && data[m.nama] != null) s.value = String(data[m.nama]);
                }

                if (m.pilihan) {
                    isiOpsi(m.pilihan);
                } else if (m.sumber) {
                    getJSON(m.sumber, function (hasil) {
                        // Pilihan opsional: kalau gagal, medannya tetap ada
                        // dengan "—" saja.
                        if (!hasil || hasil.status !== 200) return;
                        isiOpsi(((hasil.data || {}).data || []).map(function (x) {
                            return { nilai: x[m.nilai], teks: x[m.teks] };
                        }));
                    }, ...tokenHeader());
                }
                bungkus.appendChild(s);
            } else {
                bungkus.appendChild(Object.assign(el("label", "block text-sm font-medium mb-1.5", m.label),
                    { htmlFor: "f_" + m.nama }));
                const i = document.createElement("input");
                i.id = "f_" + m.nama;
                i.name = m.nama;
                i.type = m.tipe || "text";
                i.className = "medan" + (m.mono ? " font-data" : "");
                if (m.wajib) i.required = true;
                i.value = data ? (data[m.nama] == null ? "" : data[m.nama]) : "";
                bungkus.appendChild(i);
            }
            if (m.petunjuk) bungkus.appendChild(el("p", "text-xs text-tinta-redup mt-1", m.petunjuk));
            if (m.jika) bungkus.dataset.jika = m.nama;
            medanForm.appendChild(bungkus);
        });
        // Medan bersyarat: tampil hanya kalau medan pengendalinya bernilai
        // salah satu yang disebut; dievaluasi ulang tiap pengendali berubah.
        const bersyarat = ent().medan.filter(function (m) { return m.jika; });
        function terapkanJika() {
            bersyarat.forEach(function (m) {
                const kendali = form.elements[m.jika.medan];
                const bungkus = medanForm.querySelector('[data-jika="' + m.nama + '"]');
                if (!kendali || !bungkus) return;
                bungkus.hidden = !m.jika.nilai.includes(String(kendali.value));
            });
        }
        bersyarat.forEach(function (m) {
            const kendali = form.elements[m.jika.medan];
            if (kendali && !kendali.dataset.jikaTerpasang) {
                kendali.dataset.jikaTerpasang = "1";
                kendali.addEventListener("change", terapkanJika);
            }
        });
        terapkanJika();
    }
    function gambarSaring() {
        kosongkan(segmenSaring);
        const daftar = ent().saring;
        segmenSaring.hidden = !daftar;
        if (!daftar) { saringAktif = ""; return; }
        daftar.forEach(function (sr) {
            const b = el("button", "", sr.label);
            b.type = "button";
            b.dataset.nilai = sr.param;
            b.setAttribute("aria-pressed", String(sr.param === saringAktif));
            b.addEventListener("click", function () {
                saringAktif = sr.param;
                halaman = 1;
                segmenSaring.querySelectorAll("button").forEach(function (x) {
                    x.setAttribute("aria-pressed", String(x.dataset.nilai === saringAktif));
                });
                muat();
            });
            segmenSaring.appendChild(b);
        });
    }

    function bukaForm(r) {
        sunting = r || null;
        document.getElementById("judulLaci").textContent =
            (r ? "Ubah " : "Tambah ") + ent().tunggal;
        sembunyikan(document.getElementById("pesanLaci"));
        gambarMedan(r);
        laci.buka();
    }

    document.getElementById("tombolTambah").addEventListener("click", function () { bukaForm(null); });

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        const pl = document.getElementById("pesanLaci");
        sembunyikan(pl);
        const tombol = document.getElementById("tombolSimpan");
        tombol.disabled = true;

        const f = {};
        ent().medan.forEach(function (m) {
            const elemen = form.elements[m.nama];
            if (!elemen) return;
            f[m.nama] = m.tipe === "centang" ? elemen.checked
                : (elemen.value.trim ? elemen.value.trim() : elemen.value);
        });
        const jalur = ent().jalur + (sunting ? "?id=" + encodeURIComponent(sunting.id) : "");
        postJSON(jalur, ent().keluar(f), function (hasil) {
            tombol.disabled = false;
            if (!sehat(hasil, pl)) return;
            laci.tutup();
            muat();
        }, ...tokenHeader());
    });

    function hapusBaris(r) {
        const nama = r.name || r.prodi || r.matkul || r.uname;
        if (!window.confirm("Hapus " + ent().tunggal + " " + nama + "?")) return;
        deleteJSON(ent().jalur + "/" + encodeURIComponent(r.id), {}, function (hasil) {
            // Server menolak yang masih dipakai, dengan pesan yang menyebut
            // berapa dan apa pemakainya. sehat() meneruskannya apa adanya.
            if (!sehat(hasil, elPesan)) return;
            muat();
        }, ...tokenHeader());
    }

    urutan.forEach(function (k) {
        const b = el("button", "", ENTITAS[k].label);
        b.type = "button";
        b.dataset.entitas = k;
        b.setAttribute("aria-pressed", String(k === kini));
        b.addEventListener("click", function () {
            kini = k;
            halaman = 1;
            saringAktif = "";
            inpCari.value = "";
            inpCari.placeholder = "Cari " + ENTITAS[k].tunggal + "…";
            segmen.querySelectorAll("button").forEach(function (x) {
                x.setAttribute("aria-pressed", String(x.dataset.entitas === k));
            });
            gambarSaring();
            muat();
        });
        segmen.appendChild(b);
    });

    let jeda;
    inpCari.addEventListener("input", function () {
        clearTimeout(jeda);
        jeda = setTimeout(function () { halaman = 1; muat(); }, 350);
    });

    inpCari.placeholder = "Cari " + ent().tunggal + "…";
    gambarSaring();
    muat();
}
</script>
</body>
</html>
