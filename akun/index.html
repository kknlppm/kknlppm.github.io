<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <title>Akun saya — LPPM Universitas Al-Ghifari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema dipasang SEBELUM stylesheet supaya halaman gelap tidak berkedip putih. -->
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="max-w-xl mx-auto px-5 py-5">
  <div id="pesan" hidden role="alert"></div>

  <!-- Identitas dulu, sandi kemudian. Orang membuka halaman ini untuk dua
       hal, dan yang pertama adalah memastikan ia masuk sebagai siapa. -->
  <section class="bg-kertas rounded-2xl shadow-kartu p-5 mb-5">
    <h2 class="judul-halaman text-base mb-4">Identitas</h2>
    <dl id="identitas" class="grid sm:grid-cols-2 gap-x-8 gap-y-3 text-sm"></dl>
    <p class="text-xs text-tinta-redup mt-4">
      Nama dan peran diubah admin lewat Data induk. Kalau ada yang keliru,
      hubungi LPPM — bukan diperbaiki sendiri di sini.
    </p>
  </section>

  <section class="bg-kertas rounded-2xl shadow-kartu p-5">
    <h2 class="judul-halaman text-base mb-1">Ganti sandi</h2>
    <p class="text-xs text-tinta-redup mb-4">
      Sandi lama wajib diisi. Sesudah diganti, sesi di perangkat lain masih
      berlaku sampai dua jam — token tidak bisa ditarik lebih cepat.
    </p>

    <form id="formSandi" class="grid gap-4" novalidate>
      <div>
        <label for="lama" class="block text-sm font-medium mb-1.5">Sandi sekarang</label>
        <input id="lama" name="lama" type="password" class="medan" required
               autocomplete="current-password">
      </div>
      <div>
        <label for="baru" class="block text-sm font-medium mb-1.5">Sandi baru</label>
        <input id="baru" name="baru" type="password" class="medan" required
               autocomplete="new-password" minlength="8">
        <p class="text-xs text-tinta-redup mt-1">Minimal 8 karakter.</p>
      </div>
      <div>
        <label for="ulang" class="block text-sm font-medium mb-1.5">Ulangi sandi baru</label>
        <input id="ulang" name="ulang" type="password" class="medan" required
               autocomplete="new-password">
      </div>
      <div class="flex items-center gap-3">
        <button id="tombolSimpan" type="submit" class="tombol-utama">Simpan sandi</button>
        <output id="penanda" class="text-sm text-tinta-redup" aria-live="polite"></output>
      </div>
    </form>
  </section>
</main>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { getValue } from "/assets/js/jscroot/element.js";
import { backend } from "/assets/js/config.js";
import { requireLogin, tokenHeader } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { el, pesan, sembunyikan, sehat } from "/assets/js/ui.js";

if (requireLogin()) {
    pasang("Akun saya", "Identitas dan sandi");

    // ── identitas ──
    // Dibaca dari /auth/me, bukan dari localStorage: yang di localStorage
    // adalah salinan saat masuk, dan bisa basi kalau admin mengubah peran
    // sesudahnya. Halaman yang gunanya memastikan "saya masuk sebagai siapa"
    // tidak boleh menjawabnya dari ingatan.
    const dl = document.getElementById("identitas");

    function pasangBaris(kunci, nilai) {
        if (nilai == null || nilai === "") return;
        const dt = el("dt", "eyebrow text-tinta-redup", kunci);
        // `break-words` + `min-w-0`: kolom grid-nya ~232px di kartu max-w-xl,
        // dan surel 40+ karakter (~300px) menembus padding kartunya.
        const dd = el("dd", "mb-1 break-words min-w-0", String(nilai));
        dl.appendChild(dt);
        dl.appendChild(dd);
    }

    getJSON(backend.auth.me, function (hasil) {
        if (!sehat(hasil, elPesan)) return;
        const d = (hasil.data || {}).data || {};
        pasangBaris("Nama", d.name);
        pasangBaris("Nama pengguna", d.uname);
        pasangBaris("Peran", d.role_name);

        // Kontak tinggal di dokumen domainnya, dan bentuknya berbeda per
        // peran — mahasiswa punya NIM dan kelas, dosen punya NIDN.
        const p = d.profil;
        if (p && p.jenis === "mahasiswa") {
            pasangBaris("NIM", p.nim);
            pasangBaris("Kelas", p.kelas);
            pasangBaris("Email", p.email);
            pasangBaris("Telepon", p.phone);
            pasangBaris("Domisili", p.domisili);
        } else if (p && p.jenis === "dosen") {
            pasangBaris("NIDN", p.nidn);
            pasangBaris("Email", p.email);
            const peran = [];
            if (p.status_dpl) peran.push("Pembimbing lapangan KKN");
            if (p.status_dpmk) peran.push("Pengampu mata kuliah");
            pasangBaris("Penugasan", peran.join(" · "));
        }
        if (!dl.children.length) pasangBaris("Nama", "(tidak diketahui)");
    }, ...tokenHeader());

    const form = document.getElementById("formSandi");
    const elPesan = document.getElementById("pesan");
    const penanda = document.getElementById("penanda");
    const tombol = document.getElementById("tombolSimpan");

    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        sembunyikan(elPesan);
        const lama = getValue("lama");
        const baru = getValue("baru");
        const ulang = getValue("ulang");

        // Diperiksa di sini juga supaya orang tidak menunggu perjalanan ke
        // server untuk kesalahan yang sudah terlihat. Yang menegakkan
        // aturannya tetap backend.
        if (baru.length < 8) {
            pesan(elPesan, "Sandi baru minimal 8 karakter.", "galat");
            return;
        }
        if (baru !== ulang) {
            pesan(elPesan, "Ulangan sandi tidak sama.", "galat");
            return;
        }
        if (baru === lama) {
            pesan(elPesan, "Sandi baru sama dengan yang lama.", "galat");
            return;
        }

        tombol.disabled = true;
        penanda.textContent = "Menyimpan…";
        postJSON(backend.auth.sandi, { lama: lama, baru: baru }, function (hasil) {
            tombol.disabled = false;
            penanda.textContent = "";
            // sehat() menangani 401 dengan membuang sesi dan kembali ke login
            // — di halaman lain itu benar, tapi DI SINI 401 berarti "sandi
            // lama salah", bukan "sesi habis". Karena itu diperiksa sendiri
            // lebih dulu; kalau tidak, salah ketik satu huruf melempar orang
            // keluar dari aplikasi.
            if (hasil && hasil.status === 401) {
                pesan(elPesan, "Sandi sekarang salah.", "galat");
                return;
            }
            if (!sehat(hasil, elPesan)) return;
            form.reset();
            pesan(elPesan, "Sandi diperbarui.", "sah");
        }, ...tokenHeader());
    });
}
</script>
</body>
</html>
